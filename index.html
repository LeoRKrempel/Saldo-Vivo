<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Saldo Vivo — Finanças Pessoais</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2d4424">
<meta name="description" content="Plataforma pessoal de controle financeiro com bancos, cartões, financiamentos e empréstimos.">

<!-- iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Saldo Vivo">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- Favicon -->
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">

<!-- Fontes & ícones -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
  :root {
    --ink: #1a1f1a;
    --ink-2: #3a4438;
    --ink-3: #6b7568;
    --paper: #faf7f0;
    --paper-2: #f3eee2;
    --paper-3: #e8e1cf;
    --line: #d4cbb3;
    --line-soft: #e5dcc4;
    --moss: #4a6b3c;
    --moss-dark: #2d4424;
    --moss-light: #e3ecd6;
    --rust: #b54a25;
    --rust-light: #f5d8c9;
    --ochre: #c79328;
    --ochre-light: #f3e2b3;
    --sage: #7a8a6b;
    --plum: #6b3a52;
    --plum-light: #ead4df;
    --teal: #2d6b6b;
    --teal-light: #cde0e0;
    --shadow: 0 1px 0 rgba(26, 31, 26, 0.04), 0 2px 4px rgba(26, 31, 26, 0.04);
    --shadow-lg: 0 1px 0 rgba(26, 31, 26, 0.04), 0 8px 24px rgba(26, 31, 26, 0.08);
    --radius: 12px;
    --radius-sm: 8px;
    --radius-lg: 18px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #f0ebdc;
      --ink-2: #c9c2ad;
      --ink-3: #8a8470;
      --paper: #1a1d18;
      --paper-2: #232720;
      --paper-3: #2d3229;
      --line: #3a3f33;
      --line-soft: #2d3229;
      --moss: #8ab070;
      --moss-dark: #b8d49c;
      --moss-light: #2d3a24;
      --rust: #e07a52;
      --rust-light: #3d2418;
      --ochre: #e0b450;
      --ochre-light: #3a2e15;
      --plum: #c98aa8;
      --plum-light: #3a2030;
      --teal: #6dafaf;
      --teal-light: #1a2e2e;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter Tight', sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.6;
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 10% 10%, rgba(74, 107, 60, 0.04) 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(181, 74, 37, 0.03) 0%, transparent 40%);
  }

  .serif { font-family: 'Fraunces', serif; font-optical-sizing: auto; }
  .mono { font-family: 'JetBrains Mono', monospace; }

  .topbar {
    border-bottom: 1px solid var(--line);
    background: var(--paper);
    position: sticky;
    top: 0;
    z-index: 50;
    backdrop-filter: blur(8px);
    background-color: rgba(250, 247, 240, 0.85);
  }
  @media (prefers-color-scheme: dark) {
    .topbar { background-color: rgba(26, 29, 24, 0.85); }
  }

  .topbar-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 18px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .brand-mark {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--moss-dark);
    color: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 18px;
    font-style: italic;
    position: relative;
  }
  .brand-mark::after {
    content: '';
    position: absolute;
    inset: -3px;
    border: 1px solid var(--moss-dark);
    border-radius: 50%;
    opacity: 0.3;
  }
  .brand-name {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.02em;
  }
  .brand-name em {
    font-style: italic;
    font-weight: 400;
    color: var(--moss);
  }
  .brand-sub {
    font-size: 11px;
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: 0.18em;
    margin-top: -2px;
  }

  .month-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 6px 6px 16px;
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-radius: 100px;
  }
  .month-pill-text {
    font-family: 'Fraunces', serif;
    font-size: 15px;
    font-weight: 500;
    text-transform: lowercase;
    font-style: italic;
    color: var(--ink);
    min-width: 140px;
    text-align: center;
  }
  .month-btn {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--paper);
    border: 1px solid var(--line);
    color: var(--ink-2);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }
  .month-btn:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .container { max-width: 1280px; margin: 0 auto; padding: 32px; }

  .tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--line);
    margin-bottom: 32px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    background: transparent;
    border: none;
    padding: 12px 20px;
    font-family: inherit;
    font-size: 13px;
    color: var(--ink-3);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    transition: all 0.2s ease;
    position: relative;
    margin-bottom: -1px;
    font-weight: 500;
  }
  .tab:hover { color: var(--ink); }
  .tab.active {
    color: var(--ink);
    border-bottom-color: var(--moss-dark);
  }
  .tab i { font-size: 16px; }

  .pane { display: none; }
  .pane.active { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  .hero {
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 24px;
    margin-bottom: 32px;
  }
  @media (max-width: 880px) { .hero { grid-template-columns: 1fr; } }

  .health-card {
    background: var(--ink);
    color: var(--paper);
    border-radius: var(--radius-lg);
    padding: 32px;
    position: relative;
    overflow: hidden;
  }
  .health-card::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -10%;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(138, 176, 112, 0.15) 0%, transparent 70%);
    pointer-events: none;
  }
  .health-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--ink-3);
    margin-bottom: 12px;
  }
  .health-score-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }
  .health-score {
    font-family: 'Fraunces', serif;
    font-size: 84px;
    font-weight: 300;
    line-height: 1;
    letter-spacing: -0.04em;
  }
  .health-status {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 22px;
    color: var(--paper-2);
  }
  .health-bar {
    height: 4px;
    background: rgba(240, 235, 220, 0.1);
    border-radius: 100px;
    margin: 20px 0;
    overflow: hidden;
  }
  .health-fill {
    height: 100%;
    border-radius: 100px;
    transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .health-fill.good { background: #8ab070; }
  .health-fill.fair { background: #e0b450; }
  .health-fill.poor { background: #e07a52; }
  .health-explain {
    font-size: 13px;
    color: var(--paper-3);
    opacity: 0.7;
    line-height: 1.5;
  }

  .balance-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 28px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .balance-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--ink-3);
    margin-bottom: 8px;
  }
  .balance-value {
    font-family: 'Fraunces', serif;
    font-size: 42px;
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  .balance-value.positive { color: var(--moss); }
  .balance-value.negative { color: var(--rust); }
  .balance-quote {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 13px;
    color: var(--ink-3);
    margin-top: 12px;
    line-height: 1.5;
  }
  .balance-split {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--line-soft);
  }
  .balance-split-item .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--ink-3);
    margin-bottom: 2px;
  }
  .balance-split-item .value {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 500;
  }
  .balance-split-item .value.in { color: var(--moss); }
  .balance-split-item .value.out { color: var(--rust); }

  .metrics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1px;
    background: var(--line-soft);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 32px;
  }
  .metric {
    background: var(--paper);
    padding: 20px;
  }
  .metric-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--ink-3);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .metric-value {
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 500;
    letter-spacing: -0.02em;
  }
  .metric-sub {
    font-size: 11px;
    color: var(--ink-3);
    margin-top: 4px;
  }

  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .card-title {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 500;
    letter-spacing: -0.01em;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .card-title i { font-size: 20px; color: var(--moss); }
  .card-subtitle {
    font-size: 12px;
    color: var(--ink-3);
    margin-bottom: 18px;
  }

  .section-eyebrow {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    color: var(--ink-3);
    margin-bottom: 6px;
  }
  .section-title {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 400;
    letter-spacing: -0.02em;
    margin-bottom: 20px;
  }
  .section-title em { font-style: italic; color: var(--moss); }

  .form-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  input[type="text"], input[type="number"], input[type="month"], select {
    font-family: inherit;
    font-size: 14px;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--paper);
    color: var(--ink);
    outline: none;
    transition: all 0.15s ease;
  }
  input:focus, select:focus {
    border-color: var(--moss-dark);
    box-shadow: 0 0 0 3px rgba(45, 68, 36, 0.08);
  }
  input::placeholder { color: var(--ink-3); }
  .in-grow { flex: 1; min-width: 160px; }
  .in-sm { width: 110px; }
  .in-md { width: 150px; }

  .btn {
    font-family: inherit;
    padding: 10px 16px;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s ease;
  }
  .btn-primary {
    background: var(--ink);
    color: var(--paper);
  }
  .btn-primary:hover { background: var(--moss-dark); }
  .btn-icon {
    width: 38px;
    height: 38px;
    padding: 0;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }
  .btn-icon:hover { background: var(--moss-dark); transform: translateY(-1px); }
  .btn-icon.danger {
    width: 30px;
    height: 30px;
    background: transparent;
    color: var(--ink-3);
    border: 1px solid var(--line);
  }
  .btn-icon.danger:hover { background: var(--rust); color: var(--paper); border-color: var(--rust); transform: none; }

  .btn-mini {
    font-family: inherit;
    font-size: 11px;
    padding: 4px 10px;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    color: var(--ink-3);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: all 0.15s ease;
  }
  .btn-mini:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .btn-mini i { font-size: 13px; }
  .btn-icon i { font-size: 16px; }
  .btn-secondary {
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--line);
  }
  .btn-secondary:hover { background: var(--paper-2); }

  .list-item {
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 12px 16px;
    background: var(--paper-2);
    border-radius: var(--radius-sm);
    margin-bottom: 8px;
    flex-wrap: wrap;
    transition: all 0.15s ease;
  }
  .list-item:hover { background: var(--paper-3); }
  .list-name {
    flex: 1;
    min-width: 140px;
    font-size: 14px;
    font-weight: 500;
  }
  .list-value {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 500;
    min-width: 100px;
    text-align: right;
  }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 100px;
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .tag-moss { background: var(--moss-light); color: var(--moss-dark); }
  .tag-rust { background: var(--rust-light); color: var(--rust); }
  .tag-ochre { background: var(--ochre-light); color: #6b4f10; }
  .tag-plum { background: var(--plum-light); color: var(--plum); }
  .tag-teal { background: var(--teal-light); color: var(--teal); }
  .tag-sage { background: var(--paper-3); color: var(--ink-2); }

  @media (prefers-color-scheme: dark) {
    .tag-ochre { color: #e0b450; }
  }

  .empty {
    text-align: center;
    padding: 32px 16px;
    color: var(--ink-3);
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 14px;
  }
  .empty i {
    display: block;
    font-size: 28px;
    margin: 0 auto 8px;
    color: var(--ink-3);
    opacity: 0.5;
  }

  .suggestion {
    padding: 16px 18px;
    border-radius: var(--radius-sm);
    margin-bottom: 10px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    border-left: 3px solid;
  }
  .suggestion i { font-size: 20px; flex-shrink: 0; margin-top: 2px; }
  .suggestion-text {
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink);
  }
  .sug-danger { background: var(--rust-light); border-color: var(--rust); }
  .sug-warning { background: var(--ochre-light); border-color: var(--ochre); }
  .sug-success { background: var(--moss-light); border-color: var(--moss); }
  .sug-info { background: var(--teal-light); border-color: var(--teal); }
  .sug-danger i { color: var(--rust); }
  .sug-warning i { color: var(--ochre); }
  .sug-success i { color: var(--moss); }
  .sug-info i { color: var(--teal); }

  .bank-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }
  .bank-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
    gap: 12px;
  }
  .bank-card-title {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 500;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .bank-card-meta {
    font-size: 12px;
    color: var(--ink-3);
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .bank-card-meta span {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .bank-card-meta i { font-size: 14px; }
  .bank-card-total {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 500;
    text-align: right;
  }

  /* Bank logo icon */
  .bank-logo {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: white;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: -0.02em;
  }
  .bank-logo svg { width: 28px; height: 28px; }
  .bank-logo.small { width: 28px; height: 28px; border-radius: 7px; font-size: 11px; }
  .bank-logo.small svg { width: 18px; height: 18px; }
  .bank-logo.nubank { background: #820ad1; }
  .bank-logo.inter { background: #ff7a00; }
  .bank-logo.mercadopago { background: #00b1ea; color: #2d3277; }
  .bank-logo.itau { background: #ec7000; }
  .bank-logo.bradesco { background: #cc092f; }
  .bank-logo.santander { background: #ec0000; }
  .bank-logo.bb { background: #fff100; color: #003d7a; }
  .bank-logo.caixa { background: #0058a3; }
  .bank-logo.c6 { background: #1d1d1b; color: #ffd400; }
  .bank-logo.picpay { background: #11c76f; }
  .bank-logo.custom { /* uses inline background */ }

  .purchase-row {
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    gap: 12px;
    padding: 10px 0;
    border-top: 1px solid var(--line-soft);
    font-size: 13px;
    align-items: center;
    transition: opacity 0.2s ease;
  }
  .purchase-row:first-of-type { border-top: none; }
  .purchase-desc { color: var(--ink); }
  .purchase-progress {
    font-size: 11px;
    color: var(--ink-3);
    margin-top: 2px;
  }
  .purchase-value {
    font-family: 'Fraunces', serif;
    font-size: 15px;
    font-weight: 500;
  }

  /* Checkbox de "parcela paga" — usado em compras de cartão, financiamentos e empréstimos */
  .paid-check {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    background: var(--paper);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--paper);
    padding: 0;
    transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    flex-shrink: 0;
  }
  .paid-check:hover {
    border-color: var(--moss);
    transform: scale(1.08);
  }
  .paid-check.paid {
    background: var(--moss);

const BANK_COLORS_CUSTOM = [
  { name: 'Musgo', value: '#4a6b3c' },

const TABS = [
  { key: 'dashboard', icon: 'ti-layout-dashboard', label: 'Visão geral' },
  { key: 'incomes', icon: 'ti-cash', label: 'Receitas' },

function todayMonthKey() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

const state = {
  currentMonth: todayMonthKey(),
  activeTab: 'dashboard',
  editing: null,  // { kind: 'list'|'purchase'|'loan'|'bloan'|'rule', id: '...', listKey?: '...' (para list), cardId?: '...' (para purchase) }
  months: {},
  banks: [],
  cards: [],
  loans: [],
  bankLoans: [],
  recurringRules: []  // [{ id, name, amount, listKey, frequency: 'monthly'|'yearly', startMonth: 'YYYY-MM', endMonth: 'YYYY-MM'|null, anniversaryMonth?: 1-12 (anual), active, skipMonths?: {'YYYY-MM': true} }]
};

const STORAGE_KEY = 'saldo-vivo-v5';
const STORAGE_KEY_V4 = 'saldo-vivo-v4';
const STORAGE_KEY_V3 = 'saldo-vivo-v3';
const STORAGE_KEY_V2 = 'saldo-vivo-v2';
const STORAGE_KEY_OLD = 'saldo-vivo-v1';

function emptyMonth() { return { incomes: [], extras: [], fixed: [], apps: [], misc: [] }; }
function getMonth(key) { if (!state.months[key]) state.months[key] = emptyMonth(); return state.months[key]; }
function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }

// Conta quantas parcelas estão marcadas como pagas no paidMap
function countPaid(paidMap) {
  if (!paidMap) return 0;
  return Object.values(paidMap).filter(v => v === true).length;
}
// Verifica se uma parcela específica (1-indexed) está paga
function isInstallmentPaid(paidMap, installmentNumber) {
  return !!(paidMap && paidMap[installmentNumber]);
}
// Marca/desmarca parcela
function toggleInstallment(paidMap, installmentNumber) {
  if (!paidMap) return { [installmentNumber]: true };
  const next = { ...paidMap };
  if (next[installmentNumber]) delete next[installmentNumber];
  else next[installmentNumber] = true;
  return next;
}

function fmtBRL(n) {
  return (n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', minimumFractionDigits: 2 });
}
function fmtMonth(key) {
  const [y, m] = key.split('-');
  const names = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  return names[parseInt(m)-1] + ' de ' + y;
}
function shiftMonth(key, delta) {
  const [y, m] = key.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}

function persist() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      months: state.months, banks: state.banks, cards: state.cards, loans: state.loans,
      bankLoans: state.bankLoans,
      recurringRules: state.recurringRules,
      version: 5, savedAt: new Date().toISOString()
    }));
    showToast('Salvo', 'ti-check');
  } catch (e) {
    showToast('Erro ao salvar', 'ti-alert-triangle');
    console.error(e);
  }
}

// Migra estruturas para v4: converte "paidInstallments" numérico em paidMap {1:true, 2:true,...}
// e inicializa paidMap vazio nas compras de cartão.
function migrateToV4() {
  // Loans (financiamentos): paidInstallments numérico → paidMap
  (state.loans || []).forEach(l => {
    if (l.paidMap) return;
    const paidCount = parseInt(l.paidInstallments) || 0;
    const map = {};
    for (let i = 1; i <= paidCount; i++) map[i] = true;
    l.paidMap = map;
  });
  // BankLoans: idem
  (state.bankLoans || []).forEach(l => {
    if (l.paidMap) return;
    const paidCount = parseInt(l.paidInstallments) || 0;
    const map = {};
    for (let i = 1; i <= paidCount; i++) map[i] = true;
    l.paidMap = map;
  });
  // Cards: cada compra ganha paidMap vazio (sem marcação prévia possível)
  (state.cards || []).forEach(c => {
    (c.purchases || []).forEach(p => {
      if (!p.paidMap) p.paidMap = {};
    });
  });
}

function loadFromStorage() {
  try {
    // v5 (atual)
    let raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      state.months = data.months || {};
      state.banks = data.banks || [];
      state.cards = data.cards || [];
      state.loans = data.loans || [];
      state.bankLoans = data.bankLoans || [];
      state.recurringRules = data.recurringRules || [];
      migrateToV4();
      return;
    }
    // v4 → v5 (adiciona recurringRules vazio)
    raw = localStorage.getItem(STORAGE_KEY_V4);
    if (raw) {
      const data = JSON.parse(raw);
      state.months = data.months || {};
      state.banks = data.banks || [];
      state.cards = data.cards || [];
      state.loans = data.loans || [];
      state.bankLoans = data.bankLoans || [];
      state.recurringRules = [];
      migrateToV4();
      persist();
      return;
    }
    // v3 → v5
    raw = localStorage.getItem(STORAGE_KEY_V3);
    if (raw) {
      const data = JSON.parse(raw);
      state.months = data.months || {};
      state.banks = data.banks || [];
      state.cards = data.cards || [];
      state.loans = data.loans || [];
      state.bankLoans = data.bankLoans || [];
      state.recurringRules = [];
      migrateToV4();
      persist();
      return;
    }
    // v2 → v5
    raw = localStorage.getItem(STORAGE_KEY_V2);
    if (raw) {
      const data = JSON.parse(raw);
      state.months = data.months || {};
      state.banks = data.banks || [];
      state.cards = data.cards || [];
      state.loans = data.loans || [];
      state.bankLoans = [];
      state.recurringRules = [];
      migrateToV4();
      persist();
      return;
    }
    // v1 → v5
    const old = localStorage.getItem(STORAGE_KEY_OLD);
    if (old) {
      const oldData = JSON.parse(old);
      state.months = oldData.months || {};
      state.banks = (oldData.banks || []).map(b => ({
        ...b,
        logoClass: 'custom',
        logoColor: b.color || '#4a6b3c',
        rotativeRate: b.rotativeRate || 0,
        parcelRate: b.interestRate || 0,
        moraRate: b.moraRate || 1.0,
        fineRate: b.fineRate || 2.0,
        iofFixed: b.iofFixed || 0.38,
        iofDaily: b.iofDaily || 0.0082
      }));
      state.cards = oldData.cards || [];
      state.loans = oldData.loans || [];
      state.bankLoans = [];
      state.recurringRules = [];
      migrateToV4();
      persist();
      return;
    }
  } catch (e) { console.error('load err', e); }
}

function exportData() {
  const data = {
    months: state.months, banks: state.banks, cards: state.cards, loans: state.loans,
    bankLoans: state.bankLoans,
    recurringRules: state.recurringRules,
    exportedAt: new Date().toISOString(), version: 5
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `saldo-vivo-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Backup baixado', 'ti-download');
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.months) state.months = data.months;
      if (data.banks) state.banks = data.banks;
      if (data.cards) state.cards = data.cards;
      if (data.loans) state.loans = data.loans;
      if (data.bankLoans) state.bankLoans = data.bankLoans;
      if (data.recurringRules) state.recurringRules = data.recurringRules;
      persist(); render();
      showToast('Dados importados', 'ti-upload');
    } catch (err) {
      showToast('Arquivo inválido', 'ti-alert-triangle');
    }
  };
  reader.readAsText(file);
}

// ===================== CALCULATIONS =====================
// ===== RECORRÊNCIAS (REGRA VIVA) =====
// Cada regra tem: { id, name, amount, listKey, frequency: 'monthly'|'yearly',
//                   startMonth: 'YYYY-MM', endMonth: 'YYYY-MM'|null,
//                   anniversaryMonth: 1-12 (mês 1=jan..12=dez, só para yearly),
//                   active: bool, skipMonths: {'YYYY-MM': true} }
//
// "Regra viva": não materializamos as ocorrências em state.months. Em vez disso,
// quando alguém pergunta "quais são os itens do mês X?", retornamos os itens físicos
// MAIS os itens derivados das regras ativas naquele mês.

function monthKeyToIndex(mk) {
  const [y, m] = mk.split('-').map(Number);
  return y * 12 + (m - 1);
}

// Verifica se uma regra está ativa em determinado mês
function isRuleActiveInMonth(rule, monthKey) {
  if (!rule || rule.active === false) return false;
  const idx = monthKeyToIndex(monthKey);
  const startIdx = rule.startMonth ? monthKeyToIndex(rule.startMonth) : -Infinity;
  const endIdx = rule.endMonth ? monthKeyToIndex(rule.endMonth) : Infinity;
  if (idx < startIdx || idx > endIdx) return false;
  // Se foi marcada para pular este mês específico, considera inativa neste mês
  if (rule.skipMonths && rule.skipMonths[monthKey]) return false;
  // Anual: só ativa no mês de aniversário
  if (rule.frequency === 'yearly') {
    const [, mm] = monthKey.split('-').map(Number);
    const anniversaryMonth = parseInt(rule.anniversaryMonth) || (rule.startMonth ? parseInt(rule.startMonth.split('-')[1]) : 1);
    if (mm !== anniversaryMonth) return false;
  }
  return true;
}

// Retorna os items do mês para uma listKey, mesclando físicos + derivados de regras.
// Items derivados são identificados por terem `recurringRuleId` e id no formato `rule:RULEID:YYYY-MM`.
function getEffectiveListItems(monthKey, listKey) {
  const m = getMonth(monthKey);
  const physical = (m[listKey] || []).slice();
  // Adiciona items derivados de regras ativas. Se já existe um item físico com o mesmo recurringRuleId no mês
  // (ex: foi "destacado" para edição), o item físico prevalece (não duplica).
  const physicalRuleIds = new Set(physical.filter(x => x.recurringRuleId).map(x => x.recurringRuleId));
  (state.recurringRules || []).forEach(rule => {
    if (rule.listKey !== listKey) return;
    if (!isRuleActiveInMonth(rule, monthKey)) return;
    if (physicalRuleIds.has(rule.id)) return; // já tem versão física, usa essa
    // Item virtual derivado da regra
    const virtualId = 'rule:' + rule.id + ':' + monthKey;
    // Procura se há marca de pago neste mês específico
    const paidMap = rule.paidByMonth || {};
    physical.push({
      id: virtualId,
      name: rule.name,
      amount: rule.amount,
      paid: !!paidMap[monthKey],
      recurringRuleId: rule.id,
      isVirtual: true,
      ruleFrequency: rule.frequency
    });
  });
  return physical;
}

// Marca/desmarca um item virtual como pago (afeta a regra, não o mês)
function toggleVirtualPaid(ruleId, monthKey) {
  const rule = (state.recurringRules || []).find(r => r.id === ruleId);
  if (!rule) return;
  if (!rule.paidByMonth) rule.paidByMonth = {};
  if (rule.paidByMonth[monthKey]) delete rule.paidByMonth[monthKey];
  else rule.paidByMonth[monthKey] = true;
}

// Sobra do mês anterior = saldo realizado positivo do mês imediatamente anterior.
// (Entradas recebidas - tudo que foi pago). Retorna 0 se negativo/sem dados.
function calcPreviousSurplus(monthKey) {
  const prevKey = shiftMonth(monthKey, -1);
  const prevT = calcMonthTotals(prevKey);
  return Math.max(0, prevT.currentBalance);
}

// Lista parcelas/itens VENCIDOS: de meses anteriores ao atual e ainda não pagos.
function calcOverdue(currentMonthKey) {
  const overdueItems = [];
  let overdueTotal = 0;
  const currentIdx = monthKeyToIndex(currentMonthKey);

  // Itens físicos de fixos/apps/lazer de meses anteriores não pagos
  Object.keys(state.months || {}).forEach(mk => {
    if (monthKeyToIndex(mk) >= currentIdx) return;
    const m = state.months[mk];
    ['fixed', 'apps', 'misc'].forEach(listKey => {
      (m[listKey] || []).forEach(it => {
        if (!it.paid) {
          const v = +it.amount || 0;
          if (v > 0) {
            overdueTotal += v;
            overdueItems.push({ source: listKey, monthKey: mk, name: it.name, amount: v,
              label: { fixed: 'Fixo', apps: 'App', misc: 'Lazer' }[listKey] });
          }
        }
      });
    });
  });

  // Itens VIRTUAIS (de regras) de meses anteriores não pagos — varre cada mês entre início da regra e o atual
  (state.recurringRules || []).forEach(rule => {
    if (!['fixed', 'apps', 'misc'].includes(rule.listKey)) return; // só despesas vencem
    if (!rule.startMonth) return;
    const startIdx = monthKeyToIndex(rule.startMonth);
    for (let idx = startIdx; idx < currentIdx; idx++) {
      const mk = String(Math.floor(idx / 12)) + '-' + String((idx % 12) + 1).padStart(2, '0');
      if (!isRuleActiveInMonth(rule, mk)) continue;
      // Se já existe item físico com esse recurringRuleId no mês, ignora (não duplica)
      const physical = (state.months[mk] && state.months[mk][rule.listKey]) || [];
      if (physical.some(x => x.recurringRuleId === rule.id)) continue;
      const paidByMonth = rule.paidByMonth || {};
      if (!paidByMonth[mk]) {
        overdueTotal += (+rule.amount || 0);
        overdueItems.push({ source: rule.listKey, monthKey: mk, name: rule.name, amount: +rule.amount || 0,
          label: { fixed: 'Fixo', apps: 'App', misc: 'Lazer' }[rule.listKey] + ' ↻' });
      }
    }
  });

  // Parcelas de cartão de meses anteriores não pagas
  state.cards.forEach(card => {
    (card.purchases || []).forEach(p => {
      const installmentsTotal = p.installments || 1;
      const [py, pm] = p.date.split('-').map(Number);
      const startIdx = py * 12 + (pm - 1);
      for (let n = 1; n <= installmentsTotal; n++) {
        const idx = startIdx + (n - 1);
        if (idx < currentIdx && !isInstallmentPaid(p.paidMap, n)) {
          const amount = +p.amount || 0;
          let installmentValue = (p.withInterest && p.interestRate > 0 && installmentsTotal > 1)
            ? amount * (p.interestRate/100) / (1 - Math.pow(1 + (p.interestRate/100), -installmentsTotal))
            : amount / installmentsTotal;
          overdueTotal += installmentValue;
          const mk = String(Math.floor(idx / 12)) + '-' + String((idx % 12) + 1).padStart(2, '0');
          overdueItems.push({ source: 'card', monthKey: mk,
            name: `${card.name} · ${p.description} (${n}/${installmentsTotal})`, amount: installmentValue, label: 'Cartão' });
        }
      }
    });
  });

  // Financiamentos
  state.loans.forEach(l => {
    const [ly, lm] = (l.startDate || currentMonthKey).split('-').map(Number);
    const startIdx = ly * 12 + (lm - 1);
    const totalInst = parseInt(l.installments) || 0;
    const monthlyValue = +l.monthlyAmount || 0;
    for (let n = 1; n <= totalInst; n++) {
      const idx = startIdx + (n - 1);
      if (idx < currentIdx && !isInstallmentPaid(l.paidMap, n)) {
        overdueTotal += monthlyValue;
        const mk = String(Math.floor(idx / 12)) + '-' + String((idx % 12) + 1).padStart(2, '0');
        overdueItems.push({ source: 'loan', monthKey: mk, name: `${l.name} (${n}/${totalInst})`, amount: monthlyValue, label: 'Financ.' });
      }
    }
  });

  // Empréstimos bancários
  (state.bankLoans || []).forEach(l => {
    const [ly, lm] = (l.startDate || currentMonthKey).split('-').map(Number);
    const startIdx = ly * 12 + (lm - 1);
    const totalInst = parseInt(l.installments) || 0;
    const monthlyValue = +l.monthlyAmount || 0;
    for (let n = 1; n <= totalInst; n++) {
      const idx = startIdx + (n - 1);
      if (idx < currentIdx && !isInstallmentPaid(l.paidMap, n)) {
        overdueTotal += monthlyValue;
        const mk = String(Math.floor(idx / 12)) + '-' + String((idx % 12) + 1).padStart(2, '0');
        overdueItems.push({ source: 'bloan', monthKey: mk, name: `${l.name} (${n}/${totalInst})`, amount: monthlyValue, label: 'Empréstimo' });
      }
    }
  });

  overdueItems.sort((a, b) => a.monthKey.localeCompare(b.monthKey));
  return { items: overdueItems, total: overdueTotal };
}

function calcMonthTotals(monthKey) {
  const m = getMonth(monthKey);
  // Receitas e extras: por enquanto não têm recorrência (você pediu fixos/apps/lazer)
  // Mas mesmo assim usamos getEffectiveListItems pra preparar o caminho futuro
  const incomesEff = getEffectiveListItems(monthKey, 'incomes');
  const extrasEff = getEffectiveListItems(monthKey, 'extras');
  const fixedEff = getEffectiveListItems(monthKey, 'fixed');
  const appsEff = getEffectiveListItems(monthKey, 'apps');
  const miscEff = getEffectiveListItems(monthKey, 'misc');

  const totalIncome = incomesEff.reduce((s, x) => s + (+x.amount || 0), 0);
  const totalExtra = extrasEff.reduce((s, x) => s + (+x.amount || 0), 0);
  const totalFixed = fixedEff.reduce((s, x) => s + (+x.amount || 0), 0);
  const totalApps = appsEff.reduce((s, x) => s + (+x.amount || 0), 0);
  const totalMisc = miscEff.reduce((s, x) => s + (+x.amount || 0), 0);

  // Pagos das listas (fixos/apps/lazer): só conta o que tem flag .paid = true
  const paidFixed = fixedEff.filter(x => x.paid).reduce((s, x) => s + (+x.amount || 0), 0);
  const paidApps = appsEff.filter(x => x.paid).reduce((s, x) => s + (+x.amount || 0), 0);
  const paidMisc = miscEff.filter(x => x.paid).reduce((s, x) => s + (+x.amount || 0), 0);

  let totalCards = 0;
  let paidCards = 0;
  const cardDetails = {};
  state.cards.forEach(c => { cardDetails[c.id] = { name: c.name, total: 0, items: [] }; });
  state.cards.forEach(card => {
    (card.purchases || []).forEach(p => {
      const installmentsTotal = p.installments || 1;
      const [py, pm] = p.date.split('-').map(Number);
      const [cy, cm] = monthKey.split('-').map(Number);
      const diff = (cy - py) * 12 + (cm - pm);
      if (diff >= 0 && diff < installmentsTotal) {
        const amount = +p.amount || 0;
        let installmentValue;
        if (p.withInterest && p.interestRate > 0 && installmentsTotal > 1) {
          const i = p.interestRate / 100;
          installmentValue = amount * i / (1 - Math.pow(1 + i, -installmentsTotal));
        } else {
          installmentValue = amount / installmentsTotal;
        }
        const installmentNum = diff + 1;
        const isPaid = isInstallmentPaid(p.paidMap, installmentNum);
        // Sempre soma no total previsto, independente de pago
        totalCards += installmentValue;
        cardDetails[card.id].total += installmentValue;
        if (isPaid) paidCards += installmentValue;
        cardDetails[card.id].items.push({
          purchaseId: p.id,
          cardId: card.id,
          desc: p.description,
          installmentValue,
          current: installmentNum,
          total: installmentsTotal,
          withInterest: !!p.withInterest,
          interestRate: p.interestRate || 0,
          originalAmount: amount,
          originalDate: p.date,
          isPaid
        });
      }
    });
  });

  let totalLoans = 0;
  let paidLoans = 0;
  const loanDetails = [];
  state.loans.forEach(l => {
    const [ly, lm] = (l.startDate || monthKey).split('-').map(Number);
    const [cy, cm] = monthKey.split('-').map(Number);
    const diff = (cy - ly) * 12 + (cm - lm);
    const totalInst = parseInt(l.installments) || 0;
    if (diff >= 0 && diff < totalInst) {
      const installmentNum = diff + 1;
      const isPaid = isInstallmentPaid(l.paidMap, installmentNum);
      const monthlyValue = +l.monthlyAmount || 0;
      totalLoans += monthlyValue;
      if (isPaid) paidLoans += monthlyValue;
      loanDetails.push({ loanId: l.id, name: l.name, value: monthlyValue, installmentNum, total: totalInst, isPaid });
    }
  });

  // Empréstimos bancários (pessoais, consignados): tratados como financiamentos
  let totalBankLoans = 0;
  let paidBankLoans = 0;
  const bankLoanDetails = [];
  (state.bankLoans || []).forEach(l => {
    const [ly, lm] = (l.startDate || monthKey).split('-').map(Number);
    const [cy, cm] = monthKey.split('-').map(Number);
    const diff = (cy - ly) * 12 + (cm - lm);
    const totalInst = parseInt(l.installments) || 0;
    if (diff >= 0 && diff < totalInst) {
      const installmentNum = diff + 1;
      const isPaid = isInstallmentPaid(l.paidMap, installmentNum);
      const monthlyValue = +l.monthlyAmount || 0;
      totalBankLoans += monthlyValue;
      if (isPaid) paidBankLoans += monthlyValue;
      bankLoanDetails.push({ loanId: l.id, name: l.name, value: monthlyValue, installmentNum, total: totalInst, isPaid });
    }
  });

  const totalIn = totalIncome + totalExtra;
  // totalOut: TUDO do mês (pago + pendente)
  const totalOut = totalFixed + totalApps + totalMisc + totalCards + totalLoans + totalBankLoans;
  // totalPaid: soma do que efetivamente foi pago
  const totalPaid = paidFixed + paidApps + paidMisc + paidCards + paidLoans + paidBankLoans;
  // totalPending: o que ainda falta pagar
  const totalPending = totalOut - totalPaid;

  // balance: saldo "se pagar tudo" (entradas - tudo previsto)
  const balance = totalIn - totalOut;
  // currentBalance: o que de fato tem na mão AGORA (entradas - já pago) — não conta pendente
  const currentBalance = totalIn - totalPaid;

  const savingRate = totalIn > 0 ? (balance / totalIn) * 100 : 0;
  // debtRate: cartões + empréstimos / renda. SEMPRE no total, não muda com pagamento
  const debtRate = totalIn > 0 ? ((totalCards + totalLoans + totalBankLoans) / totalIn) * 100 : 0;

  return {
    totalIncome, totalExtra, totalFixed, totalApps, totalMisc, totalCards, totalLoans, totalBankLoans,
    totalIn, totalOut, totalPaid, totalPending,
    balance, currentBalance, savingRate, debtRate,
    cardDetails, bankLoanDetails, loanDetails
  };
}

function healthScore(t) {
  if (t.totalIn === 0) return { score: 0, label: 'sem dados ainda', cls: 'poor' };
  let score = 50;
  if (t.savingRate >= 20) score += 30;
  else if (t.savingRate >= 10) score += 20;
  else if (t.savingRate >= 5) score += 10;
  else if (t.savingRate < 0) score -= 20;
  if (t.debtRate <= 10) score += 20;
  else if (t.debtRate <= 30) score += 10;
  else if (t.debtRate > 70) score -= 30;
  else if (t.debtRate > 50) score -= 15;
  score = Math.max(0, Math.min(100, score));
  let label, cls;
  if (score >= 70) { label = 'saudável'; cls = 'good'; }
  else if (score >= 45) { label = 'em atenção'; cls = 'fair'; }
  else { label = 'crítica'; cls = 'poor'; }
  return { score: Math.round(score), label, cls };
}

// Calcula saldo devedor de uma dívida com detecção de inconsistência entre
// parcela informada e taxa de juros mensal.
// Retorna { pv, linearBalance, isInconsistent, impliedRate, expectedMonthly, mode }
function calcSafePV(totalAmount, monthlyPayment, monthlyRatePct, totalInstallments, paidInstallments) {
  const remaining = totalInstallments - paidInstallments;
  const i = monthlyRatePct / 100;
  const linearBalance = remaining * monthlyPayment;  // soma simples do que falta pagar
  let pv = linearBalance;
  let isInconsistent = false;
  let impliedRate = null;
  let expectedMonthly = null;

  if (i > 0 && remaining > 0) {
    // PV padrão (Tabela Price) das parcelas restantes
    pv = monthlyPayment * (1 - Math.pow(1 + i, -remaining)) / i;

    // Se temos o valor total financiado, verificamos se taxa e parcela são compatíveis
    if (totalAmount > 0 && totalInstallments > 0) {
      // Parcela ESPERADA pela Tabela Price para essa taxa e prazo
      expectedMonthly = totalAmount * i / (1 - Math.pow(1 + i, -totalInstallments));
      // Se a diferença for grande (>15%), provavelmente o usuário confundiu taxa anual com mensal
      const diff = Math.abs(expectedMonthly - monthlyPayment) / monthlyPayment;
      if (diff > 0.15) {
        isInconsistent = true;
        // Estima a taxa que realmente produziria essa parcela (Newton-Raphson simples)
        impliedRate = estimateImpliedRate(totalAmount, monthlyPayment, totalInstallments);
      }
    }
  }

  return { pv, linearBalance, isInconsistent, impliedRate, expectedMonthly };
}

// Encontra a taxa mensal que dá a parcela observada (método de Newton-Raphson)
function estimateImpliedRate(pv, pmt, n) {
  if (pmt * n <= pv) return 0;
  let i = 0.01;
  for (let k = 0; k < 100; k++) {
    const denom = 1 - Math.pow(1 + i, -n);
    if (denom === 0) break;
    const f = pmt - pv * i / denom;
    const df = -pv * (denom - i * n * Math.pow(1 + i, -n - 1)) / (denom * denom);
    if (Math.abs(df) < 1e-12) break;
    const newI = i - f / df;
    if (newI < 0 || newI > 10) break;
    if (Math.abs(newI - i) < 1e-9) return newI;
    i = newI;
  }
  return i;
}

// Renderiza uma grade de parcelas com checkboxes para um financiamento/empréstimo.
// kind: 'loan' (financiamento) ou 'bloan' (empréstimo bancário) — define o data attribute do botão
function renderInstallmentsList(loan, kind) {
  const totalInst = parseInt(loan.installments) || 0;
  const monthly = +loan.monthlyAmount || 0;
  const paidMap = loan.paidMap || {};
  if (totalInst === 0) return '';
  const startDate = loan.startDate || todayMonthKey();
  const [sy, sm] = startDate.split('-').map(Number);
  const monthNames = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  // Constrói lista de objetos {n, paid, monthLabel}
  const cells = [];
  for (let n = 1; n <= totalInst; n++) {
    const d = new Date(sy, sm - 1 + (n - 1), 1);
    const monthLabel = monthNames[d.getMonth()] + '/' + String(d.getFullYear()).slice(2);
    cells.push({ n, paid: !!paidMap[n], monthLabel });
  }
  return `
    <div class="installments-grid">
      ${cells.map(c => `
        <button
          class="installment-cell ${c.paid ? 'paid' : ''}"
          data-toggle-${kind}-paid="${loan.id}:${c.n}"
          title="${c.paid ? 'Pago' : 'Pendente'} · parcela ${c.n}/${totalInst} · ${c.monthLabel} · ${fmtBRL(monthly)}"
          aria-label="Parcela ${c.n} ${c.paid ? 'paga' : 'pendente'}"
        >
          <span class="installment-n">${c.n}</span>
          <span class="installment-month">${c.monthLabel}</span>
        </button>
      `).join('')}
    </div>
  `;
}

function generateSuggestions(t) {
  const list = [];
  if (t.totalIn === 0) { list.push({ kind: 'info', icon: 'ti-info-circle', text: 'Comece adicionando seus salários e ganhos do mês na aba "Receitas". A partir daí, todas as outras análises ganham contexto.' }); return list; }
  if (t.balance < 0) list.push({ kind: 'danger', icon: 'ti-alert-triangle', text: `Você está negativo em ${fmtBRL(Math.abs(t.balance))} este mês. Revise primeiro miscelâneas e apps — são os mais flexíveis. Use o simulador para parcelar com menor impacto se precisar.` });
  else if (t.savingRate < 5) list.push({ kind: 'warning', icon: 'ti-alert-circle', text: `Sua margem é de apenas ${t.savingRate.toFixed(1)}%. O ideal é poupar ao menos 10% — corte um app ou serviço pouco usado para criar essa folga.` });
  else if (t.savingRate >= 20) list.push({ kind: 'success', icon: 'ti-trending-up', text: `Excelente! Você poupou ${t.savingRate.toFixed(1)}% (${fmtBRL(t.balance)}). Considere investir essa sobra: CDB, Tesouro Selic ou fundo conservador para fazer o dinheiro render.` });
  else if (t.savingRate >= 10) list.push({ kind: 'success', icon: 'ti-check', text: `Boa margem de ${t.savingRate.toFixed(1)}% poupada (${fmtBRL(t.balance)}). Defina um destino: reserva de emergência ou amortizar dívida de juros mais alto.` });
  if (t.debtRate > 50) list.push({ kind: 'danger', icon: 'ti-credit-card-off', text: `Dívidas consomem ${t.debtRate.toFixed(1)}% da renda — bem acima dos 30% recomendados. Priorize amortizar primeiro a de maior juros (geralmente cartão).` });
  else if (t.debtRate > 30) list.push({ kind: 'warning', icon: 'ti-credit-card', text: `Endividamento em ${t.debtRate.toFixed(1)}% da renda. Acima de 30% começa a apertar — evite assumir novas parcelas longas.` });
  if (t.totalApps > t.totalIn * 0.15 && t.totalIn > 0) list.push({ kind: 'warning', icon: 'ti-device-mobile', text: `Apps e assinaturas representam ${(t.totalApps/t.totalIn*100).toFixed(1)}% da renda. Liste todos e cancele o que usou menos de duas vezes neste mês.` });
  if (t.totalFixed > t.totalIn * 0.5 && t.totalIn > 0) list.push({ kind: 'warning', icon: 'ti-home', text: `Gastos fixos consomem ${(t.totalFixed/t.totalIn*100).toFixed(1)}% da renda. O ideal é abaixo de 50% — dado para decisões de médio prazo como moradia ou plano de internet.` });
  if (t.totalExtra > 0) list.push({ kind: 'info', icon: 'ti-cash', text: `Você teve ${fmtBRL(t.totalExtra)} de renda extra. Destine 100% disso para amortizar dívidas ou reserva — assim trava o ganho antes que vire gasto.` });
  if (list.length === 0) list.push({ kind: 'success', icon: 'ti-mood-smile', text: 'Suas finanças estão equilibradas neste mês. Mantenha o registro contínuo — é o que permite identificar padrões ao longo do ano.' });
  return list;
}

// ===================== BANK LOGO HELPER =====================
function bankLogoHTML(bank, size) {
  const sizeClass = size === 'small' ? ' small' : '';
  if (bank.logoClass && bank.logoClass !== 'custom') {
    return `<div class="bank-logo ${bank.logoClass}${sizeClass}">${bank.logoMark || ''}</div>`;
  }
  const color = bank.logoColor || '#4a6b3c';
  const initial = (bank.name || '?').charAt(0).toUpperCase();
  return `<div class="bank-logo${sizeClass}" style="background: ${color};">${initial}</div>`;
}

// ===================== RENDER =====================
function render() {
  document.getElementById('month-label').textContent = fmtMonth(state.currentMonth);
  renderTabs();
  renderPanes();
  bindEvents();
}

function renderTabs() {
  document.getElementById('tabs').innerHTML = TABS.map(t => `
    <button class="tab ${state.activeTab === t.key ? 'active' : ''}" data-tab="${t.key}">
      <i class="ti ${t.icon}"></i>${t.label}
    </button>
  `).join('');
}

function renderPanes() {
  const m = getMonth(state.currentMonth);
  const t = calcMonthTotals(state.currentMonth);
  const h = healthScore(t);

  document.getElementById('panes').innerHTML = `
    <div class="pane ${state.activeTab==='dashboard'?'active':''}">${renderDashboard(t, h, m)}</div>
    <div class="pane ${state.activeTab==='incomes'?'active':''}">${renderIncomes(m)}</div>
    <div class="pane ${state.activeTab==='fixed'?'active':''}">${renderListPane('fixed', 'Gastos fixos', 'ti-home', 'Aluguel, contas e tudo que repete', 'Ex: Aluguel, Luz, Condomínio…', getEffectiveListItems(state.currentMonth, 'fixed'), 'fixos')}</div>
    <div class="pane ${state.activeTab==='apps'?'active':''}">${renderListPane('apps', 'Apps e assinaturas', 'ti-device-mobile', 'Streaming, cloud, jogos, clubes', 'Ex: Netflix, Spotify, iCloud…', getEffectiveListItems(state.currentMonth, 'apps'), 'apps')}</div>
    <div class="pane ${state.activeTab==='misc'?'active':''}">${renderListPane('misc', 'Miscelâneas', 'ti-shopping-cart', 'Gastos variáveis do dia a dia', 'Ex: Uber, restaurante, presente…', getEffectiveListItems(state.currentMonth, 'misc'), 'misc')}</div>
    <div class="pane ${state.activeTab==='banks'?'active':''}">${renderBanks()}</div>
    <div class="pane ${state.activeTab==='cards'?'active':''}">${renderCards(t)}</div>
    <div class="pane ${state.activeTab==='loans-bank'?'active':''}">${renderBankLoans(t)}</div>
    <div class="pane ${state.activeTab==='loans'?'active':''}">${renderLoans()}</div>
    <div class="pane ${state.activeTab==='simulator'?'active':''}">${renderSimulator()}</div>
    <div class="pane ${state.activeTab==='year'?'active':''}">${renderYear()}</div>
  `;

  if (state.activeTab === 'dashboard') drawMonthChart(t);
  if (state.activeTab === 'year') drawYearChart();
}

function renderDashboard(t, h, m) {
  const sugs = generateSuggestions(t);

  // Cálculo da dívida total do ano corrente
  const [y] = state.currentMonth.split('-');
  let yearDebtTotal = 0;
  for (let i = 1; i <= 12; i++) {
    const key = y + '-' + String(i).padStart(2, '0');
    const mt = calcMonthTotals(key);
    yearDebtTotal += (mt.totalCards + mt.totalLoans + mt.totalBankLoans);
  }

  // Sobra do mês anterior
  const previousSurplus = calcPreviousSurplus(state.currentMonth);
  const prevMonthLabel = fmtMonth(shiftMonth(state.currentMonth, -1));

  return `
    <div class="section-eyebrow">Visão geral · ${fmtMonth(state.currentMonth)}</div>
    <div class="section-title">Como está o seu <em>fôlego</em> financeiro este mês</div>

    ${previousSurplus > 0 ? `
      <div style="margin-bottom: 24px;">
        <div class="card" style="border-left: 3px solid var(--moss); background: var(--moss-light);">
          <div class="card-title" style="color: var(--moss-dark);"><i class="ti ti-pig-money" style="color: var(--moss);"></i> Sobra do mês anterior</div>
          <div class="card-subtitle">De ${prevMonthLabel}</div>
          <div style="font-family: 'Fraunces', serif; font-size: 28px; font-weight: 500; color: var(--moss-dark);">+ ${fmtBRL(previousSurplus)}</div>
          <div style="font-size: 12px; color: var(--ink-2); margin-top: 6px; font-family: 'Fraunces', serif; font-style: italic;">Dinheiro que sobrou depois do que você pagou no mês passado. É reserva — não se mistura com a renda deste mês.</div>
        </div>
      </div>
    ` : ''}

    <div class="hero">
      <div class="health-card">
        <div class="health-label">Saúde financeira</div>
        <div class="health-score-row">
          <span class="health-score">${h.score}</span>
          <span class="health-status">${h.label}</span>
        </div>
        <div class="health-bar"><div class="health-fill ${h.cls}" style="width: ${h.score}%;"></div></div>
        <div class="health-explain">Cálculo baseado na sua taxa de poupança (idealmente 10% ou mais) e no nível de endividamento (idealmente até 30% da renda).</div>
      </div>
      <div class="balance-card">
        <div>
          <div class="balance-label">Dinheiro na mão · ${fmtMonth(state.currentMonth)}</div>
          <div class="balance-value ${t.currentBalance >= 0 ? 'positive' : 'negative'}">${fmtBRL(t.currentBalance)}</div>
          ${t.totalIn > 0 ? `<div class="balance-quote">${
            t.currentBalance >= 0
              ? (t.totalPending > 0
                  ? `Sobrou isso depois do que você já pagou. Ainda faltam ${fmtBRL(t.totalPending)} pra fechar o mês.`
                  : 'Tudo pago. O que sobra agora constrói amanhã.')
              : 'Pagou mais do que entrou. Marque com cuidado o que de fato foi pago.'
          }</div>` : '<div class="balance-quote">Comece lançando suas receitas e despesas.</div>'}
        </div>
        <div class="balance-split">
          <div class="balance-split-item">
            <div class="label">Entradas</div>
            <div class="value in">${fmtBRL(t.totalIn)}</div>
          </div>
          <div class="balance-split-item">
            <div class="label">Já pago</div>
            <div class="value" style="color: var(--moss-dark);">${fmtBRL(t.totalPaid)}</div>
          </div>
        </div>
        <div class="balance-split" style="margin-top: 8px; padding-top: 12px; border-top: 0.5px dashed var(--line-soft);">
          <div class="balance-split-item">
            <div class="label" title="Soma de tudo lançado no mês, pago ou não">Previsto</div>
            <div class="value" style="color: var(--ink-3);">${fmtBRL(t.totalOut)}</div>
          </div>
          <div class="balance-split-item">
            <div class="label" title="O que ainda falta pagar deste mês">Pendente</div>
            <div class="value" style="color: var(--rust);">${fmtBRL(t.totalPending)}</div>
          </div>
        </div>
      </div>
    </div>

    <div class="metrics">
      <div class="metric"><div class="metric-label"><i class="ti ti-home"></i> Fixos</div><div class="metric-value">${fmtBRL(t.totalFixed)}</div>${t.totalIn > 0 ? `<div class="metric-sub">${(t.totalFixed/t.totalIn*100).toFixed(1)}% da renda</div>` : ''}</div>
      <div class="metric"><div class="metric-label"><i class="ti ti-device-mobile"></i> Apps</div><div class="metric-value">${fmtBRL(t.totalApps)}</div>${t.totalIn > 0 ? `<div class="metric-sub">${(t.totalApps/t.totalIn*100).toFixed(1)}% da renda</div>` : ''}</div>
      <div class="metric"><div class="metric-label"><i class="ti ti-shopping-cart"></i> Miscelâneas</div><div class="metric-value">${fmtBRL(t.totalMisc)}</div>${t.totalIn > 0 ? `<div class="metric-sub">${(t.totalMisc/t.totalIn*100).toFixed(1)}% da renda</div>` : ''}</div>
      <div class="metric"><div class="metric-label"><i class="ti ti-credit-card"></i> Cartões</div><div class="metric-value">${fmtBRL(t.totalCards)}</div>${t.totalIn > 0 ? `<div class="metric-sub">${(t.totalCards/t.totalIn*100).toFixed(1)}% da renda</div>` : ''}</div>
      <div class="metric"><div class="metric-label"><i class="ti ti-cash-banknote"></i> Empréstimos</div><div class="metric-value">${fmtBRL(t.totalBankLoans)}</div>${t.totalIn > 0 ? `<div class="metric-sub">${(t.totalBankLoans/t.totalIn*100).toFixed(1)}% da renda</div>` : ''}</div>
      <div class="metric"><div class="metric-label"><i class="ti ti-receipt"></i> Financiamentos</div><div class="metric-value">${fmtBRL(t.totalLoans)}</div>${t.totalIn > 0 ? `<div class="metric-sub">${(t.totalLoans/t.totalIn*100).toFixed(1)}% da renda</div>` : ''}</div>
      <div class="metric" style="background: var(--paper-2); border-left: 3px solid var(--rust);">
        <div class="metric-label" style="color: var(--rust); font-weight: 600;"><i class="ti ti-alert-octagon"></i> Dívida Total ${y}</div>
        <div class="metric-value" style="color: var(--rust);">${fmtBRL(yearDebtTotal)}</div>
        <div class="metric-sub">Soma de todas as parcelas do ano</div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card-title"><i class="ti ti-chart-donut"></i> Distribuição das saídas</div>
        <div class="card-subtitle">Por categoria</div>
        ${t.totalOut === 0 ? '<div class="empty"><i class="ti ti-coin-off"></i>Sem gastos lançados ainda neste mês.</div>' : `
          <div class="donut-wrap"><canvas id="month-chart"></canvas></div>
          <div style="margin-top: 16px;">
            <div style="display: flex; justify-content: space-between; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); margin-bottom: 6px;">
              <span>Pago ${fmtBRL(t.totalPaid)}</span>
              <span>Pendente ${fmtBRL(t.totalPending)}</span>
            </div>
            <div style="display: flex; height: 12px; border-radius: 100px; overflow: hidden; background: var(--rust-light);">
              <div style="width: ${t.totalOut > 0 ? (t.totalPaid / t.totalOut * 100) : 0}%; background: var(--moss); transition: width 0.4s ease;"></div>
            </div>
            <div style="font-size: 11px; color: var(--ink-3); margin-top: 6px; text-align: center;">${t.totalOut > 0 ? (t.totalPaid / t.totalOut * 100).toFixed(0) : 0}% das saídas do mês já foram pagas</div>
          </div>
        `}
      </div>
      <div class="card">
        <div class="card-title"><i class="ti ti-bulb"></i> Sugestões para você</div>
        <div class="card-subtitle">Baseadas no que foi lançado este mês</div>
        ${sugs.map(s => `<div class="suggestion sug-${s.kind}"><i class="ti ${s.icon}"></i><div class="suggestion-text">${s.text}</div></div>`).join('')}
      </div>
    </div>
  `;
}

      <div class="form-row" style="margin-top: 12px;">

function renderListPane(listKey, title, icon, subtitle, placeholder, items, tagLabel) {
  const tagClass = { fixos: 'tag-moss', apps: 'tag-ochre', misc: 'tag-sage' }[tagLabel] || 'tag-sage';
  const payable = ['fixed', 'apps', 'misc'].includes(listKey);
  // Regras desta categoria
  const myRules = (state.recurringRules || []).filter(r => r.listKey === listKey);
  // Marcação em massa
  const physicalUnpaid = items.filter(it => !it.paid).length;
  const physicalPaid = items.filter(it => it.paid).length;

  return `
    <div class="section-eyebrow">${title}</div>
    <div class="section-title">${subtitle}</div>

    ${payable ? `
      <div class="card" style="background: var(--teal-light); border-left: 3px solid var(--teal);">
        <div class="card-title" style="color: var(--teal); margin-bottom: 6px;"><i class="ti ti-repeat" style="color: var(--teal);"></i> Recorrentes ${title.toLowerCase()}</div>
        <div class="card-subtitle">Regras que se repetem mês a mês ou ano a ano — basta cadastrar uma vez. Item recorrente aparece com ↻ na lista, e altera todos os meses futuros automaticamente quando você edita a regra.</div>

        ${myRules.length === 0 ? '<div class="empty" style="padding: 14px;"><i class="ti ti-repeat-off"></i>Nenhuma regra recorrente cadastrada.</div>' : myRules.map(r => recurringRuleRow(r)).join('')}

        <div class="micro-label" style="margin-top: 14px;">Nova regra recorrente</div>
        <div class="form-row" style="margin-bottom: 6px;">
          <input type="text" class="in-grow" placeholder="Nome (Ex: Aluguel)" data-rule-new-name="${listKey}" />
          <input type="number" step="0.01" class="in-md" placeholder="Valor (R$)" data-rule-new-amount="${listKey}" />
          <select class="in-md" data-rule-new-frequency="${listKey}">
            <option value="monthly">Todo mês</option>
            <option value="yearly">Todo ano</option>
          </select>
        </div>
        <div class="form-row">
          <label style="font-size: 11px; color: var(--ink-3); display: flex; align-items: center; gap: 4px;">Começo:
            <input type="month" class="in-md" value="${state.currentMonth}" data-rule-new-start="${listKey}" />
          </label>
          <label style="font-size: 11px; color: var(--ink-3); display: flex; align-items: center; gap: 4px;">Fim (opcional):
            <input type="month" class="in-md" data-rule-new-end="${listKey}" placeholder="Sem fim" />
          </label>
          <button class="btn btn-primary" data-rule-add="${listKey}"><i class="ti ti-plus"></i> Criar regra</button>
        </div>
      </div>
    ` : ''}

    <div class="card">
      <div class="card-title" style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;">
        <span><i class="ti ${icon}"></i> Lançamentos do mês</span>
        ${payable && items.length > 0 ? `
          <div style="display: flex; gap: 6px;">
            ${physicalUnpaid > 0 ? `<button class="btn-mini" data-mark-all-paid="${listKey}" title="Marca todos os itens deste mês como pago"><i class="ti ti-checks"></i> Marcar todos como pagos</button>` : ''}
            ${physicalPaid > 0 ? `<button class="btn-mini" data-unmark-all-paid="${listKey}" title="Desmarca todos os itens deste mês"><i class="ti ti-square"></i> Desmarcar todos</button>` : ''}
          </div>
        ` : ''}
      </div>
      <div class="card-subtitle">${fmtMonth(state.currentMonth)}</div>
      ${items.length === 0 ? `<div class="empty"><i class="ti ti-pencil-plus"></i>Nada adicionado ainda. Use o formulário abaixo ou crie uma regra recorrente acima.</div>` : items.map(it => itemRow(it, listKey, tagLabel, tagClass)).join('')}
      <div class="form-row" style="margin-top: 12px;">
        <input type="text" class="in-grow" placeholder="${placeholder}" data-new="${listKey}-name" />
        <input type="number" step="0.01" class="in-md" placeholder="Valor (R$)" data-new="${listKey}-amount" />
        <button class="btn-icon" data-add="${listKey}"><i class="ti ti-plus"></i></button>
      </div>
    </div>
  `;
}

// Renderiza uma linha de regra recorrente
function recurringRuleRow(r) {
  const isEditing = state.editing && state.editing.kind === 'rule' && state.editing.id === r.id;
  const freqLabel = r.frequency === 'yearly' ? 'Anual' : 'Mensal';
  const start = r.startMonth || '—';
  const end = r.endMonth || 'sem fim';
  const status = r.active === false ? '<span style="color: var(--ink-3); font-style: italic;">(pausada)</span>' : '';

  if (isEditing) {
    return `
      <div class="list-item" style="background: var(--ochre-light); flex-wrap: wrap;">
        <span class="tag tag-teal">↻ ${freqLabel}</span>
        <input type="text" class="in-grow" value="${escapeHtml(r.name)}" data-rule-edit-name="${r.id}" />
        <input type="number" step="0.01" class="in-md" value="${+r.amount || 0}" data-rule-edit-amount="${r.id}" />
        <select class="in-md" data-rule-edit-frequency="${r.id}">
          <option value="monthly" ${r.frequency === 'monthly' ? 'selected' : ''}>Mensal</option>
          <option value="yearly" ${r.frequency === 'yearly' ? 'selected' : ''}>Anual</option>
        </select>
        <input type="month" class="in-md" value="${r.startMonth || ''}" data-rule-edit-start="${r.id}" title="Começo" />
        <input type="month" class="in-md" value="${r.endMonth || ''}" data-rule-edit-end="${r.id}" title="Fim (vazio = sem fim)" />
        <button class="btn-icon" data-rule-save="${r.id}" style="background: var(--moss-dark);"><i class="ti ti-check"></i></button>
        <button class="btn-icon danger" data-cancel-edit><i class="ti ti-x"></i></button>
      </div>
    `;
  }
  return `
    <div class="list-item" style="${r.active === false ? 'opacity: 0.55;' : ''}">
      <span class="tag tag-teal" title="${freqLabel}"><i class="ti ti-repeat" style="font-size:10px;"></i> ${freqLabel}</span>
      <span class="list-name">${escapeHtml(r.name)} ${status}</span>
      <span style="font-size: 11px; color: var(--ink-3); min-width: 110px;">${start} → ${end}${r.frequency === 'yearly' ? ` · mês ${r.anniversaryMonth || parseInt((r.startMonth||'2026-01').split('-')[1])}` : ''}</span>
      <span class="list-value">${fmtBRL(+r.amount || 0)}</span>
      <button class="btn-icon" data-rule-toggle-active="${r.id}" title="${r.active === false ? 'Reativar regra' : 'Pausar (sem excluir)'}" style="background: transparent; border: 1px solid var(--line); color: var(--ink-3); width: 30px; height: 30px;"><i class="ti ${r.active === false ? 'ti-player-play' : 'ti-player-pause'}"></i></button>
      <button class="btn-icon" data-rule-edit="${r.id}" title="Editar" style="background: transparent; border: 1px solid var(--line); color: var(--ink-3); width: 30px; height: 30px;"><i class="ti ti-pencil"></i></button>
      <button class="btn-icon danger" data-rule-del="${r.id}" title="Excluir regra"><i class="ti ti-trash"></i></button>
    </div>
  `;
}

function itemRow(it, listKey, tagText, tagClass) {
  const isEditing = state.editing && state.editing.kind === 'list' && state.editing.id === it.id && state.editing.listKey === listKey;
  // Categorias que aceitam marcação de "pago": fixos, apps e lazer
  const payable = ['fixed', 'apps', 'misc'].includes(listKey);
  const isPaid = payable && !!it.paid;
  // Origem de recorrência (se aplicável)
  const fromRule = it.recurringRuleId ? ' <span class="tag tag-teal" style="font-size: 9px;" title="Vem de uma regra de recorrência">↻</span>' : '';

  if (isEditing) {
    return `
      <div class="list-item" style="background: var(--ochre-light);">
        <span class="tag ${tagClass}">${tagText}</span>
        <input type="text" class="in-grow" value="${escapeHtml(it.name)}" data-edit-list-name="${listKey}:${it.id}" />
        <input type="number" step="0.01" class="in-md" value="${+it.amount || 0}" data-edit-list-amount="${listKey}:${it.id}" />
        <button class="btn-icon" data-save-list="${listKey}:${it.id}" aria-label="Salvar" style="background: var(--moss-dark);"><i class="ti ti-check"></i></button>
        <button class="btn-icon danger" data-cancel-edit aria-label="Cancelar"><i class="ti ti-x"></i></button>
      </div>
    `;
  }
  return `
    <div class="list-item" style="${isPaid ? 'opacity: 0.7;' : ''}">
      ${payable ? `
        <button class="paid-check ${isPaid ? 'paid' : ''}" data-toggle-list-paid="${listKey}:${it.id}" aria-label="${isPaid ? 'Desmarcar como pago' : 'Marcar como pago'}" title="${isPaid ? 'Desmarcar como pago' : 'Marcar como pago'}">
          ${isPaid ? '<i class="ti ti-check"></i>' : ''}
        </button>
      ` : ''}
      <span class="tag ${tagClass}">${tagText}</span>
      <span class="list-name" style="${isPaid ? 'text-decoration: line-through; color: var(--ink-3);' : ''}">${escapeHtml(it.name)}${fromRule} ${isPaid ? '<span class="tag tag-moss" style="margin-left: 6px;"><i class="ti ti-check" style="font-size:10px;"></i> Pago</span>' : ''}</span>
      <span class="list-value" style="${isPaid ? 'text-decoration: line-through; color: var(--ink-3);' : ''}">${fmtBRL(+it.amount || 0)}</span>
      ${it.isVirtual ? `
        <button class="btn-icon" data-detach-rule="${listKey}:${it.recurringRuleId}" aria-label="Personalizar só este mês" title="Personalizar o valor só neste mês (solta da regra, vira item editável)" style="background: transparent; border: 1px solid var(--line); color: var(--ink-3); width: 30px; height: 30px;"><i class="ti ti-pencil-cog"></i></button>
        <span style="font-size: 10px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.1em; padding-right: 6px;" title="Vem de uma regra recorrente. Para mudar todos os meses, edite a regra no topo. Para mudar só este mês, clique no lápis.">via regra</span>
      ` : `
        <button class="btn-icon" data-edit-list="${listKey}:${it.id}" aria-label="Editar" style="background: transparent; border: 1px solid var(--line); color: var(--ink-3); width: 30px; height: 30px;"><i class="ti ti-pencil"></i></button>
        <button class="btn-icon danger" data-del="${listKey}:${it.id}" aria-label="Remover"><i class="ti ti-trash"></i></button>
      `}
    </div>
  `;
}

    ${!hasBanks ? `<div class="empty" style="background: var(--paper-2); border-radius: 12px; padding: 32px;"><i class="ti ti-building-bank"></i>Cadastre primeiro um <strong>banco</strong> na aba "Bancos" para poder criar cartões.</div>` : `

        <div class="card-title"><i class="ti ti-credit-card-plus"></i> Novo cartão</div>

                    <div class="purchase-row" style="background: var(--ochre-light); border-radius: 8px; padding: 12px; align-items: center; display: flex; gap: 8px; justify-content: space-between;">

                      <div style="display: flex; gap: 4px;">

                      <div class="purchase-progress">parcela ${p.current} de ${p.total}${p.withInterest ? ` · juros embutidos` : ' · sem juros'} · total ${fmtBRL(p.originalAmount)}</div>

                    <div style="display: flex; gap: 4px;">

                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `}

          <div class="divider"></div>

            <input type="number" min="1" max="48" class="in-sm" placeholder="Parcelas" value="1" data-purchase-inst="${c.id}" />

          <div class="form-row">

              <option value="none">Sem juros (à vista ou loja)</option>
              <option value="bank">Com juros do banco</option>
            </select>
            ${bank && bank.parcelRate ? `<span style="font-size: 11px; color: var(--ink-3); align-self: center;">Juros do banco: ${bank.parcelRate}% a.m.</span>` : ''}
            <button class="btn-icon" data-add-purchase="${c.id}" style="margin-left: auto;"><i class="ti ti-plus"></i></button>
          </div>
        </div>
      `;
    }).join('')}
  `;
}

      const paid = countPaid(l.paidMap);
      const remaining = totalInst - paid;
      const monthly = +l.monthlyAmount || 0;
