function renderYear() {
  const [y] = state.currentMonth.split('-');
  let yearIn = 0, yearOut = 0, yearBalance = 0, yearPaid = 0;
  const monthsData = [];
  for (let i = 1; i <= 12; i++) {
    const key = y + '-' + String(i).padStart(2, '0');
    const t = calcMonthTotals(key);
    yearIn += t.totalIn; yearOut += t.totalOut; yearBalance += t.balance; yearPaid += t.totalPaid;
    monthsData.push({ key, t });
  }
  const yearEffectiveRate = yearOut > 0 ? (yearPaid / yearOut * 100) : 0;
  return `
    <div class="section-eyebrow">Ano · ${y}</div>
    <div class="section-title">A história inteira de <em>${y}</em></div>
    <div class="tip"><i class="ti ti-info-circle"></i> Clique em qualquer mês para abrir a visão geral dele. "Pago" é o que você efetivamente marcou como quitado; "Previsto" é tudo que estava lançado.</div>

    <div class="metrics" style="margin-bottom: 24px;">
      <div class="metric"><div class="metric-label"><i class="ti ti-arrow-down-right" style="color: var(--moss);"></i> Entradas em ${y}</div><div class="metric-value" style="color: var(--moss);">${fmtBRL(yearIn)}</div></div>
      <div class="metric"><div class="metric-label"><i class="ti ti-arrow-up-right" style="color: var(--rust);"></i> Saídas previstas</div><div class="metric-value" style="color: var(--rust);">${fmtBRL(yearOut)}</div></div>
      <div class="metric"><div class="metric-label"><i class="ti ti-check" style="color: var(--moss-dark);"></i> Efetivamente pago</div><div class="metric-value" style="color: var(--moss-dark);">${fmtBRL(yearPaid)}</div><div class="metric-sub">${yearEffectiveRate.toFixed(0)}% do previsto</div></div>
      <div class="metric"><div class="metric-label"><i class="ti ti-equal"></i> Saldo acumulado</div><div class="metric-value" style="color: ${yearBalance >= 0 ? 'var(--moss)' : 'var(--rust)'};">${fmtBRL(yearBalance)}</div></div>
    </div>

    <div class="card">
      <div class="card-title"><i class="ti ti-chart-bar"></i> Evolução mensal</div>
      <div class="card-subtitle">Entradas e saídas mês a mês</div>
      <div class="chart-wrap"><canvas id="year-chart"></canvas></div>
    </div>

    <div class="card">
      <div class="card-title"><i class="ti ti-list"></i> Detalhamento por mês</div>
      <div class="card-subtitle">Entradas · Previsto · Pago · % efetivado — clique para abrir</div>
      <div class="year-head" style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr; gap: 8px; padding: 6px 12px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); border-bottom: 1px solid var(--line);">
        <span>Mês</span>
        <span style="text-align: right;">Entradas</span>
        <span style="text-align: right;">Previsto</span>
        <span style="text-align: right;">Pago</span>
        <span style="text-align: right;">% efetivado</span>
      </div>
      ${monthsData.map(({key, t}) => {
        const monthName = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][parseInt(key.split('-')[1])-1];
        const hasData = t.totalIn > 0 || t.totalOut > 0;
        const effRate = t.totalOut > 0 ? (t.totalPaid / t.totalOut * 100) : 0;
        const effColor = effRate >= 95 ? 'var(--moss)' : (effRate >= 50 ? 'var(--ochre)' : 'var(--rust)');
        return `
          <div class="year-row ${hasData ? '' : 'empty-row'}" data-goto-month="${key}" style="cursor: pointer; display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr; gap: 8px; align-items: center;">
            <span class="month-name">${monthName}</span>
            <span class="val" style="color: var(--moss); text-align: right;">+${fmtBRL(t.totalIn)}</span>
            <span class="val" style="color: var(--ink-3); text-align: right;">${fmtBRL(t.totalOut)}</span>
            <span class="val" style="color: var(--moss-dark); text-align: right;">${fmtBRL(t.totalPaid)}</span>
            <span class="val" style="color: ${hasData && t.totalOut > 0 ? effColor : 'var(--ink-3)'}; text-align: right; font-weight: 500;">${t.totalOut > 0 ? effRate.toFixed(0) + '%' : '—'}</span>
          </div>
        `;
      }).join('')}
    </div>

    <div class="action-bar" style="margin-top: 24px;">
      <div></div>
      <div class="data-actions">
        <button id="export-btn"><i class="ti ti-download"></i> Exportar backup</button>
        <button id="import-btn"><i class="ti ti-upload"></i> Importar backup</button>
        <input type="file" id="import-file" accept=".json" style="display: none;" />
      </div>
    </div>
  `;
}



// ===================== CHARTS =====================
function drawMonthChart(t) {
  const canvas = document.getElementById('month-chart');
  if (!canvas || typeof Chart === 'undefined') return;
  const data = [
    { label: 'Fixos', value: t.totalFixed, color: '#4a6b3c' },
    { label: 'Apps', value: t.totalApps, color: '#c79328' },
    { label: 'Miscelâneas', value: t.totalMisc, color: '#7a8a6b' },
    { label: 'Cartões', value: t.totalCards, color: '#6b3a52' },
    { label: 'Empréstimos', value: t.totalBankLoans, color: '#2d6b6b' },
    { label: 'Financiamentos', value: t.totalLoans, color: '#b54a25' }
  ].filter(d => d.value > 0);
  new Chart(canvas, {
    type: 'doughnut',
    data: { labels: data.map(d => d.label), datasets: [{ data: data.map(d => d.value), backgroundColor: data.map(d => d.color), borderWidth: 2, borderColor: getComputedStyle(document.body).getPropertyValue('--paper').trim() }] },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '64%',
      plugins: {
        legend: { position: 'right', labels: { font: { family: 'Inter Tight', size: 12 }, boxWidth: 10, padding: 12, color: getComputedStyle(document.body).getPropertyValue('--ink-2').trim() } },
        tooltip: { callbacks: { label: (ctx) => ctx.label + ': ' + fmtBRL(ctx.raw) } }
      }
    }
  });
}

function drawYearChart() {
  const canvas = document.getElementById('year-chart');
  if (!canvas || typeof Chart === 'undefined') return;
  const [y] = state.currentMonth.split('-');
  const labels = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const ins = [], outs = [];
  for (let i = 1; i <= 12; i++) {
    const key = y + '-' + String(i).padStart(2, '0');
    const t = calcMonthTotals(key);
    ins.push(t.totalIn); outs.push(t.totalOut);
  }
  const inkColor = getComputedStyle(document.body).getPropertyValue('--ink-2').trim();
  const lineColor = getComputedStyle(document.body).getPropertyValue('--line-soft').trim();
  new Chart(canvas, {
    type: 'bar',
    data: { labels, datasets: [
      { label: 'Entradas', data: ins, backgroundColor: '#4a6b3c', borderRadius: 4 },
      { label: 'Saídas', data: outs, backgroundColor: '#b54a25', borderRadius: 4 }
    ]},
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: {
        y: { beginAtZero: true, grid: { color: lineColor }, ticks: { font: { family: 'JetBrains Mono', size: 11 }, color: inkColor, callback: (v) => 'R$' + (v/1000).toFixed(0) + 'k' } },
        x: { grid: { display: false }, ticks: { font: { family: 'Inter Tight', size: 12 }, color: inkColor, autoSkip: false } }
      },
      plugins: {
        legend: { position: 'top', labels: { font: { family: 'Inter Tight', size: 12 }, boxWidth: 12, color: inkColor } },
        tooltip: { callbacks: { label: (ctx) => ctx.dataset.label + ': ' + fmtBRL(ctx.raw) } }
      }
    }
  });
}



// ===================== EVENTS =====================
function bindEvents() {
  // Tabs
  document.querySelectorAll('.tab').forEach(el => {
    el.addEventListener('click', () => { state.activeTab = el.dataset.tab; render(); });
  });

  // Month nav: REMOVIDO daqui — agora é delegado uma vez só no boot
  // (anexar listeners aqui causava acúmulo: a cada render, um clique disparava N vezes,
  //  fazendo o mês pular vários meses ou anos)

  // List adds
  ['incomes', 'extras', 'fixed', 'apps', 'misc'].forEach(listKey => {
    const btn = document.querySelector(`[data-add="${listKey}"]`);
    if (btn) btn.addEventListener('click', () => {
      const name = document.querySelector(`[data-new="${listKey}-name"]`).value.trim();
      const amount = parseFloat(document.querySelector(`[data-new="${listKey}-amount"]`).value);
      if (!name || !amount) { showToast('Preencha nome e valor', 'ti-alert-circle'); return; }
      const m = getMonth(state.currentMonth);
      m[listKey].push({ id: uid(), name, amount });
      persist(); render();
    });
  });

  document.querySelectorAll('[data-del]').forEach(el => {
    el.addEventListener('click', () => {
      const [listKey, id] = el.dataset.del.split(':');
      const m = getMonth(state.currentMonth);
      m[listKey] = m[listKey].filter(x => x.id !== id);
      persist(); render();
    });
  });

  // Bank presets
  document.querySelectorAll('[data-add-preset]').forEach(el => {
    el.addEventListener('click', () => {
      const key = el.dataset.addPreset;
      const preset = BANK_PRESETS[key];
      if (!preset) return;
      state.banks.push({
        id: uid(),
        name: preset.name,
        logoClass: preset.logoClass,
        logoMark: preset.logoMark,
        rotativeRate: preset.rotativeRate,
        parcelRate: preset.parcelRate,
        moraRate: preset.moraRate,
        fineRate: preset.fineRate,
        cashAdvanceRate: preset.cashAdvanceRate,
        iofFixed: preset.iofFixed,
        iofDaily: preset.iofDaily,
        notes: preset.notes,
        loanPersonalRate: preset.loanPersonalRate,
        loanConsignedRate: preset.loanConsignedRate,
        loanInssRate: preset.loanInssRate
      });
      persist(); render();
    });
  });

  // Banks: custom
  let selectedSwatch = BANK_COLORS_CUSTOM[0].value;
  document.querySelectorAll('.bank-swatch').forEach(el => {
    el.addEventListener('click', () => {
      document.querySelectorAll('.bank-swatch').forEach(s => s.style.borderColor = 'transparent');
      el.style.borderColor = 'var(--ink)';
      selectedSwatch = el.dataset.swatch;
    });
  });
  const addCustomBtn = document.querySelector('[data-add="bank-custom"]');
  if (addCustomBtn) addCustomBtn.addEventListener('click', () => {
    const name = document.querySelector('[data-new="bank-name"]').value.trim();
    const rotat = parseFloat(document.querySelector('[data-new="bank-rotative"]').value) || 0;
    const parcel = parseFloat(document.querySelector('[data-new="bank-parcel"]').value) || 0;
    if (!name) { showToast('Informe o nome do banco', 'ti-alert-circle'); return; }
    state.banks.push({
      id: uid(),
      name,
      logoClass: 'custom',
      logoColor: selectedSwatch,
      rotativeRate: rotat,
      parcelRate: parcel,
      moraRate: 1.0,
      fineRate: 2.0,
      iofFixed: 0.38,
      iofDaily: 0.0082
    });
    persist(); render();
  });

  document.querySelectorAll('[data-del-bank]').forEach(el => {
    el.addEventListener('click', () => {
      const bid = el.dataset.delBank;
      const linkedCards = state.cards.filter(c => c.bankId === bid).length;
      if (linkedCards > 0 && !confirm(`Este banco tem ${linkedCards} cartão(ões) vinculado(s). Eles ficarão sem banco. Continuar?`)) return;
      state.banks = state.banks.filter(b => b.id !== bid);
      persist(); render();
    });
  });

  // Collapse toggles
  document.querySelectorAll('[data-collapse]').forEach(el => {
    el.addEventListener('click', () => {
      const target = document.getElementById(el.dataset.collapse);
      if (!target) return;
      target.classList.toggle('open');
      el.classList.toggle('open');
    });
  });

  // Save bank edits
  document.querySelectorAll('[data-save-bank]').forEach(el => {
    el.addEventListener('click', () => {
      const bid = el.dataset.saveBank;
      const bank = state.banks.find(b => b.id === bid);
      if (!bank) return;
      document.querySelectorAll(`[data-edit-bank^="${bid}:"]`).forEach(input => {
        const [, field] = input.dataset.editBank.split(':');
        bank[field] = parseFloat(input.value) || 0;
      });
      persist(); render();
    });
  });

  // Cards
  const addCardBtn = document.querySelector('[data-add="card"]');
  if (addCardBtn) addCardBtn.addEventListener('click', () => {
    const name = document.querySelector('[data-new="card-name"]').value.trim();
    const bankId = document.querySelector('[data-new="card-bank"]').value;
    const limit = parseFloat(document.querySelector('[data-new="card-limit"]').value) || 0;
    if (!name) { showToast('Informe o apelido do cartão', 'ti-alert-circle'); return; }
    state.cards.push({ id: uid(), name, bankId, limit, purchases: [] });
    persist(); render();
  });
  document.querySelectorAll('[data-del-card]').forEach(el => {
    el.addEventListener('click', () => {
      if (!confirm('Remover este cartão e todas as suas compras?')) return;
      state.cards = state.cards.filter(c => c.id !== el.dataset.delCard);
      persist(); render();
    });
  });
  document.querySelectorAll('[data-add-purchase]').forEach(el => {
    el.addEventListener('click', () => {
      const cid = el.dataset.addPurchase;
      const card = state.cards.find(c => c.id === cid);
      if (!card) return;
      const desc = document.querySelector(`[data-purchase-desc="${cid}"]`).value.trim();
      const amount = parseFloat(document.querySelector(`[data-purchase-amt="${cid}"]`).value);
      const installments = parseInt(document.querySelector(`[data-purchase-inst="${cid}"]`).value) || 1;
      const date = document.querySelector(`[data-purchase-date="${cid}"]`).value;
      const typeSelEl = document.querySelector(`[data-purchase-type="${cid}"]`);
      const withInterest = typeSelEl ? typeSelEl.value === 'bank' : false;
      if (!desc || !amount) { showToast('Preencha descrição e valor', 'ti-alert-circle'); return; }
      // Captura a taxa do banco no momento da compra (se for "com juros do banco")
      let interestRate = 0;
      if (withInterest) {
        const bank = state.banks.find(b => b.id === card.bankId);
        interestRate = bank ? (+bank.parcelRate || 0) : 0;
      }
      if (!card.purchases) card.purchases = [];
      card.purchases.push({
        id: uid(),
        description: desc,
        amount,
        installments,
        date,
        withInterest,
        interestRate  // % ao mês usado no cálculo
      });
      persist(); render();
    });
  });

  // Bank Loans (empréstimos)
  // Auto-preenche taxa quando muda banco ou tipo
  const bloanBankSel = document.getElementById('bloan-bank-select');
  const bloanTypeSel = document.getElementById('bloan-type-select');
  const bloanInterestInput = document.getElementById('bloan-interest-input');
  function updateBLoanRate() {
    if (!bloanBankSel || !bloanTypeSel || !bloanInterestInput) return;
    const opt = bloanBankSel.options[bloanBankSel.selectedIndex];
    if (!opt) return;
    const type = bloanTypeSel.value;
    let rate = '';
    if (type === 'personal') rate = opt.dataset.personal;
    else if (type === 'consigned') rate = opt.dataset.consigned;
    else if (type === 'inss') rate = opt.dataset.inss;
    if (rate && rate !== 'null' && rate !== 'undefined') bloanInterestInput.value = rate;
  }
  if (bloanBankSel) bloanBankSel.addEventListener('change', updateBLoanRate);
  if (bloanTypeSel) bloanTypeSel.addEventListener('change', updateBLoanRate);
  // Inicializa
  updateBLoanRate();

  const addBLoanBtn = document.querySelector('[data-add="bloan"]');
  if (addBLoanBtn) addBLoanBtn.addEventListener('click', () => {
    const name = document.querySelector('[data-new="bloan-name"]').value.trim();
    const bankId = document.querySelector('[data-new="bloan-bank"]').value;
    const loanType = document.querySelector('[data-new="bloan-type"]').value;
    const totalAmount = parseFloat(document.querySelector('[data-new="bloan-total"]').value) || 0;
    const installments = parseInt(document.querySelector('[data-new="bloan-installments"]').value);
    const paid = parseInt(document.querySelector('[data-new="bloan-paid"]').value) || 0;
    const monthly = parseFloat(document.querySelector('[data-new="bloan-monthly"]').value);
    const interest = parseFloat(document.querySelector('[data-new="bloan-interest"]').value) || 0;
    const cet = parseFloat(document.querySelector('[data-new="bloan-cet"]').value) || 0;
    const start = document.querySelector('[data-new="bloan-start"]').value;
    if (!name || !installments || !monthly) { showToast('Preencha nome, parcelas e valor', 'ti-alert-circle'); return; }
    state.bankLoans.push({
      id: uid(), name, bankId, loanType, totalAmount,
      installments,
      paidMap: (() => { const m = {}; for (let i = 1; i <= paid; i++) m[i] = true; return m; })(),
      monthlyAmount: monthly, interestRate: interest, cet,
      startDate: start
    });
    persist(); render();
  });

  document.querySelectorAll('[data-del-bloan]').forEach(el => {
    el.addEventListener('click', () => {
      if (!confirm('Remover este empréstimo?')) return;
      state.bankLoans = state.bankLoans.filter(l => l.id !== el.dataset.delBloan);
      persist(); render();
    });
  });

  // Simulação de amortização para empréstimos bancários (mesma lógica do financiamento)
  document.querySelectorAll('[data-bloan-sim]').forEach(el => {
    el.addEventListener('click', () => {
      const lid = el.dataset.bloanSim;
      const loan = state.bankLoans.find(l => l.id === lid);
      if (!loan) return;
      const amt = parseFloat(document.querySelector(`[data-bloan-amort-amt="${lid}"]`).value);
      const type = document.querySelector(`[data-bloan-amort-type="${lid}"]`).value;
      const resultEl = document.getElementById(`bloan-amort-result-${lid}`);
      if (!amt || amt <= 0) { resultEl.innerHTML = ''; return; }
      const totalInst = parseInt(loan.installments);
      const paid = countPaid(loan.paidMap);
      const remaining = totalInst - paid;
      const monthly = parseFloat(loan.monthlyAmount);
      const safe = calcSafePV(+loan.totalAmount || 0, monthly, +loan.interestRate || 0, totalInst, paid);
      // Se taxa/parcela são inconsistentes, usa a taxa implícita (verdadeira) para o cálculo
      const i = safe.isInconsistent && safe.impliedRate !== null
        ? safe.impliedRate
        : (parseFloat(loan.interestRate) || 0) / 100;
      const pv = safe.pv;
      const newPV = pv - amt;
      const inconsistencyNote = safe.isInconsistent
        ? `<div style="font-size: 12px; color: var(--ink-3); margin-bottom: 8px;"><i class="ti ti-info-circle"></i> Usando taxa real estimada de ${(i*100).toFixed(2)}% a.m. (a taxa cadastrada parece ser anual).</div>`
        : '';
      if (newPV <= 0) {
        resultEl.innerHTML = `<div class="result-block">${inconsistencyNote}<strong>Quitação total.</strong> Este valor amortizado quita o empréstimo. Economia estimada de juros: <span class="accent">${fmtBRL(remaining * monthly - pv)}</span>.</div>`;
        return;
      }
      let html = '<div class="result-block">' + inconsistencyNote;
      if (type === 'time') {
        let newN;
        if (i > 0) newN = Math.log(monthly / (monthly - newPV * i)) / Math.log(1 + i);
        else newN = newPV / monthly;
        newN = Math.ceil(newN);
        const saved = remaining * monthly - (amt + newN * monthly);
        html += `<strong>Reduzindo prazo:</strong><br>A parcela continua em ${fmtBRL(monthly)}.<br>Novo prazo: <span class="accent">${newN} parcelas</span> (antes ${remaining}).<br>Economia de juros: <span class="accent">${fmtBRL(saved)}</span>.<br>Você termina <strong>${remaining - newN} meses antes</strong>.`;
      } else {
        let newMonthly;
        if (i > 0) newMonthly = newPV * i / (1 - Math.pow(1 + i, -remaining));
        else newMonthly = newPV / remaining;
        const saved = remaining * monthly - (amt + remaining * newMonthly);
        html += `<strong>Reduzindo parcela:</strong><br>O prazo continua em ${remaining} meses.<br>Nova parcela: <span class="accent">${fmtBRL(newMonthly)}</span> (antes ${fmtBRL(monthly)}).<br>Alívio mensal: <span class="accent">${fmtBRL(monthly - newMonthly)}</span>.<br>Economia total: <span class="accent">${fmtBRL(saved)}</span>.`;
      }
      html += '</div>';
      resultEl.innerHTML = html;
    });
  });

  // Loans
  const addLoanBtn = document.querySelector('[data-add="loan"]');
  if (addLoanBtn) addLoanBtn.addEventListener('click', () => {
    const name = document.querySelector('[data-new="loan-name"]').value.trim();
    const totalAmount = parseFloat(document.querySelector('[data-new="loan-total"]').value);
    const installments = parseInt(document.querySelector('[data-new="loan-installments"]').value);
    const paid = parseInt(document.querySelector('[data-new="loan-paid"]').value) || 0;
    const monthly = parseFloat(document.querySelector('[data-new="loan-monthly"]').value);
    const interest = parseFloat(document.querySelector('[data-new="loan-interest"]').value) || 0;
    const start = document.querySelector('[data-new="loan-start"]').value;
    if (!name || !installments || !monthly) { showToast('Preencha nome, parcelas e valor da parcela', 'ti-alert-circle'); return; }
    state.loans.push({
      id: uid(), name, totalAmount, installments,
      paidMap: (() => { const m = {}; for (let i = 1; i <= paid; i++) m[i] = true; return m; })(),
      monthlyAmount: monthly, interestRate: interest, startDate: start
    });
    persist(); render();
  });
  document.querySelectorAll('[data-del-loan]').forEach(el => {
    el.addEventListener('click', () => {
      if (!confirm('Remover este financiamento?')) return;
      state.loans = state.loans.filter(l => l.id !== el.dataset.delLoan);
      persist(); render();
    });
  });

  // Amortization sim
  document.querySelectorAll('[data-sim-amort]').forEach(el => {
    el.addEventListener('click', () => {
      const lid = el.dataset.simAmort;
      const loan = state.loans.find(l => l.id === lid);
      if (!loan) return;
      const amt = parseFloat(document.querySelector(`[data-amort-amt="${lid}"]`).value);
      const type = document.querySelector(`[data-amort-type="${lid}"]`).value;
      const resultEl = document.getElementById(`amort-result-${lid}`);
      if (!amt || amt <= 0) { resultEl.innerHTML = ''; return; }
      const totalInst = parseInt(loan.installments);
      const paid = countPaid(loan.paidMap);
      const remaining = totalInst - paid;
      const monthly = parseFloat(loan.monthlyAmount);
      const safe = calcSafePV(+loan.totalAmount || 0, monthly, +loan.interestRate || 0, totalInst, paid);
      // Quando a taxa cadastrada é incoerente com a parcela, usa a taxa implícita real
      const i = safe.isInconsistent && safe.impliedRate !== null
        ? safe.impliedRate
        : (parseFloat(loan.interestRate) || 0) / 100;
      const pv = safe.pv;
      const newPV = pv - amt;
      const inconsistencyNote = safe.isInconsistent
        ? `<div style="font-size: 12px; color: var(--ink-3); margin-bottom: 8px;"><i class="ti ti-info-circle"></i> Usando taxa real estimada de ${(i*100).toFixed(2)}% a.m. (a taxa cadastrada parece ser anual).</div>`
        : '';
      if (newPV <= 0) {
        resultEl.innerHTML = `<div class="result-block">${inconsistencyNote}<strong>Quitação total.</strong> Este valor amortizado quita o financiamento. Economia estimada de juros: <span class="accent">${fmtBRL(remaining * monthly - pv)}</span>.</div>`;
        return;
      }
      let html = '<div class="result-block">' + inconsistencyNote;
      if (type === 'time') {
        let newN;
        if (i > 0) newN = Math.log(monthly / (monthly - newPV * i)) / Math.log(1 + i);
        else newN = newPV / monthly;
        newN = Math.ceil(newN);
        const saved = remaining * monthly - (amt + newN * monthly);
        html += `<strong>Reduzindo prazo:</strong><br>A parcela continua em ${fmtBRL(monthly)}.<br>Novo prazo: <span class="accent">${newN} parcelas</span> (antes ${remaining}).<br>Economia de juros: <span class="accent">${fmtBRL(saved)}</span>.<br>Você termina <strong>${remaining - newN} meses antes</strong>.`;
      } else {
        let newMonthly;
        if (i > 0) newMonthly = newPV * i / (1 - Math.pow(1 + i, -remaining));
        else newMonthly = newPV / remaining;
        const saved = remaining * monthly - (amt + remaining * newMonthly);
        html += `<strong>Reduzindo parcela:</strong><br>O prazo continua em ${remaining} meses.<br>Nova parcela: <span class="accent">${fmtBRL(newMonthly)}</span> (antes ${fmtBRL(monthly)}).<br>Alívio mensal: <span class="accent">${fmtBRL(monthly - newMonthly)}</span>.<br>Economia total: <span class="accent">${fmtBRL(saved)}</span>.`;
      }
      html += '</div>';
      resultEl.innerHTML = html;
    });
  });

  // Simulator bank select auto-fill
  const simBankSelect = document.getElementById('sim-bank-select');
  if (simBankSelect) simBankSelect.addEventListener('change', () => {
    const opt = simBankSelect.options[simBankSelect.selectedIndex];
    if (opt.value) {
      document.getElementById('sim-interest').value = opt.dataset.parcel || '';
      document.getElementById('sim-iof-fixed').value = opt.dataset.iofFixed || '0.38';
      document.getElementById('sim-iof-daily').value = opt.dataset.iofDaily || '0.0082';
    }
  });

  const simRun = document.getElementById('sim-run');
  if (simRun) simRun.addEventListener('click', () => {
    const amount = parseFloat(document.getElementById('sim-amount').value);
    const n = parseInt(document.getElementById('sim-installments').value);
    const i = parseFloat(document.getElementById('sim-interest').value) / 100;
    const iofFixed = parseFloat(document.getElementById('sim-iof-fixed').value) / 100 || 0;
    const iofDaily = parseFloat(document.getElementById('sim-iof-daily').value) / 100 || 0;
    const resultEl = document.getElementById('sim-result');
    if (!amount || !n) { resultEl.innerHTML = ''; return; }
    // Parcela Price
    let parcela = i > 0 ? amount * i / (1 - Math.pow(1 + i, -n)) : amount / n;
    const totalParcelas = parcela * n;
    const jurosPuros = totalParcelas - amount;
    // IOF: fixo sobre o valor + diário médio (estimativa: metade do prazo médio em dias)
    const diasMedios = (n * 30) / 2;  // estimativa: média ponderada dos dias até cada parcela
    const iofTotal = amount * (iofFixed + iofDaily * Math.min(diasMedios, 365));  // cap em 365 dias por regra do BC
    const totalGeral = totalParcelas + iofTotal;
    const custoTotal = jurosPuros + iofTotal;
    const m = getMonth(state.currentMonth);
    const totalIn = m.incomes.reduce((s,x)=>s+(+x.amount||0),0) + m.extras.reduce((s,x)=>s+(+x.amount||0),0);
    const pctRenda = totalIn > 0 ? (parcela / totalIn * 100) : 0;
    let conselho = '';
    const custoPct = custoTotal / amount;
    if (custoPct > 0.5) conselho = `<div class="suggestion sug-danger"><i class="ti ti-alert-triangle"></i><div class="suggestion-text">Custo total (juros + IOF) ultrapassa 50% do valor original. Evite — busque empréstimo pessoal ou negocie desconto à vista.</div></div>`;
    else if (custoPct > 0.25) conselho = `<div class="suggestion sug-warning"><i class="ti ti-alert-circle"></i><div class="suggestion-text">Custo alto (${(custoPct*100).toFixed(1)}% sobre o valor). Vale comparar com empréstimo pessoal ou consignado.</div></div>`;
    else conselho = `<div class="suggestion sug-info"><i class="ti ti-info-circle"></i><div class="suggestion-text">Taxa razoável. Se conseguir pagar à vista com desconto, ainda pode ser mais vantajoso.</div></div>`;
    resultEl.innerHTML = `
      <div class="result-block">
        <strong>Parcela mensal:</strong> <span class="accent">${fmtBRL(parcela)}</span><br>
        <strong>Total das parcelas em ${n} meses:</strong> ${fmtBRL(totalParcelas)}<br>
        <strong>Juros embutidos:</strong> ${fmtBRL(jurosPuros)} (${(jurosPuros/amount*100).toFixed(1)}%)<br>
        <strong>IOF estimado:</strong> ${fmtBRL(iofTotal)} <span style="color:var(--ink-3); font-size: 12px;">(fixo ${(iofFixed*100).toFixed(2)}% + diário ${(iofDaily*100).toFixed(4)}%)</span><br>
        <strong>Custo total da operação:</strong> <span class="accent" style="color: var(--rust);">${fmtBRL(custoTotal)}</span> (${(custoPct*100).toFixed(1)}% sobre o valor)<br>
        <strong>Você pagará no total:</strong> ${fmtBRL(totalGeral)}
        ${totalIn > 0 ? `<br><strong>Comprometimento da renda:</strong> ${pctRenda.toFixed(1)}% ${pctRenda > 30 ? '<span style="color: var(--rust);">(acima do saudável)</span>' : '<span style="color: var(--moss);">(dentro do saudável)</span>'}` : ''}
      </div>
      ${conselho}
    `;
  });

  const finRun = document.getElementById('fin-run');
  if (finRun) finRun.addEventListener('click', () => {
    const amount = parseFloat(document.getElementById('fin-amount').value);
    const n = parseInt(document.getElementById('fin-months').value);
    const i = parseFloat(document.getElementById('fin-interest').value) / 100;
    const resultEl = document.getElementById('fin-result');
    if (!amount || !n) { resultEl.innerHTML = ''; return; }
    let parcela = i > 0 ? amount * i / (1 - Math.pow(1 + i, -n)) : amount / n;
    const total = parcela * n;
    const juros = total - amount;
    resultEl.innerHTML = `<div class="result-block"><strong>Parcela mensal:</strong> <span class="accent">${fmtBRL(parcela)}</span><br><strong>Total pago em ${n} meses:</strong> ${fmtBRL(total)}<br><strong>Juros totais:</strong> <span class="accent" style="color: var(--rust);">${fmtBRL(juros)}</span><br><strong>Custo efetivo:</strong> ${(juros/amount*100).toFixed(1)}% sobre o valor financiado</div>`;
  });

  // ===== EDIÇÃO INLINE — itens de lista (receitas, fixos, apps, misc, extras) =====
  document.querySelectorAll('[data-edit-list]').forEach(el => {
    el.addEventListener('click', () => {
      const [listKey, id] = el.dataset.editList.split(':');
      state.editing = { kind: 'list', id, listKey };
      render();
    });
  });
  document.querySelectorAll('[data-save-list]').forEach(el => {
    el.addEventListener('click', () => {
      const [listKey, id] = el.dataset.saveList.split(':');
      const m = getMonth(state.currentMonth);
      const item = m[listKey].find(x => x.id === id);
      if (!item) return;
      const nameEl = document.querySelector(`[data-edit-list-name="${listKey}:${id}"]`);
      const amtEl = document.querySelector(`[data-edit-list-amount="${listKey}:${id}"]`);
      const newName = nameEl.value.trim();
      const newAmount = parseFloat(amtEl.value);
      if (!newName || isNaN(newAmount)) { showToast('Preencha nome e valor', 'ti-alert-circle'); return; }
      item.name = newName;
      item.amount = newAmount;
      state.editing = null;
      persist(); render();
    });
  });

  // ===== EDIÇÃO — compras de cartão =====
  document.querySelectorAll('[data-edit-purchase]').forEach(el => {
    el.addEventListener('click', () => {
      const [, purchaseId] = el.dataset.editPurchase.split(':');
      state.editing = { kind: 'purchase', id: purchaseId };
      render();
    });
  });
  document.querySelectorAll('[data-save-purchase]').forEach(el => {
    el.addEventListener('click', () => {
      const [cardId, purchaseId] = el.dataset.savePurchase.split(':');
      const card = state.cards.find(c => c.id === cardId);
      if (!card) return;
      const purchase = (card.purchases || []).find(p => p.id === purchaseId);
      if (!purchase) return;
      const newDesc = document.querySelector(`[data-edit-purchase-desc="${purchaseId}"]`).value.trim();
      const newAmt = parseFloat(document.querySelector(`[data-edit-purchase-amt="${purchaseId}"]`).value);
      const newInst = parseInt(document.querySelector(`[data-edit-purchase-inst="${purchaseId}"]`).value) || 1;
      const newDate = document.querySelector(`[data-edit-purchase-date="${purchaseId}"]`).value;
      const newType = document.querySelector(`[data-edit-purchase-type="${purchaseId}"]`).value;
      if (!newDesc || isNaN(newAmt)) { showToast('Preencha descrição e valor', 'ti-alert-circle'); return; }
      purchase.description = newDesc;
      purchase.amount = newAmt;
      purchase.installments = newInst;
      purchase.date = newDate;
      purchase.withInterest = newType === 'bank';
      // Se mudou pra "com juros do banco" e antes não era, captura a taxa do banco agora
      if (purchase.withInterest) {
        const bank = state.banks.find(b => b.id === card.bankId);
        purchase.interestRate = bank ? (+bank.parcelRate || 0) : (purchase.interestRate || 0);
      } else {
        purchase.interestRate = 0;
      }
      state.editing = null;
      persist(); render();
    });
  });
  document.querySelectorAll('[data-del-purchase]').forEach(el => {
    el.addEventListener('click', () => {
      const [cardId, purchaseId] = el.dataset.delPurchase.split(':');
      if (!confirm('Excluir esta compra? Todas as parcelas serão removidas.')) return;
      const card = state.cards.find(c => c.id === cardId);
      if (!card || !card.purchases) return;
      card.purchases = card.purchases.filter(p => p.id !== purchaseId);
      persist(); render();
    });
  });

  // ===== EDIÇÃO — financiamentos =====
  document.querySelectorAll('[data-edit-loan]').forEach(el => {
    el.addEventListener('click', () => {
      state.editing = { kind: 'loan', id: el.dataset.editLoan };
      render();
    });
  });
  document.querySelectorAll('[data-save-loan]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.saveLoan;
      const loan = state.loans.find(l => l.id === id);
      if (!loan) return;
      loan.name = document.querySelector(`[data-edit-loan-name="${id}"]`).value.trim() || loan.name;
      loan.totalAmount = parseFloat(document.querySelector(`[data-edit-loan-total="${id}"]`).value) || 0;
      loan.installments = parseInt(document.querySelector(`[data-edit-loan-installments="${id}"]`).value) || loan.installments;
      // "Pagas" no formulário: só reconstrói o paidMap se o número informado for diferente da contagem atual.
      // Isso preserva marcações individuais (ex: usuário pagou parcela 3 e 7) quando o campo não é alterado.
      const newPaidCount = parseInt(document.querySelector(`[data-edit-loan-paid="${id}"]`).value) || 0;
      const currentPaidCount = countPaid(loan.paidMap);
      if (newPaidCount !== currentPaidCount) {
        const m = {};
        for (let i = 1; i <= newPaidCount; i++) m[i] = true;
        loan.paidMap = m;
      }
      loan.monthlyAmount = parseFloat(document.querySelector(`[data-edit-loan-monthly="${id}"]`).value) || loan.monthlyAmount;
      loan.interestRate = parseFloat(document.querySelector(`[data-edit-loan-interest="${id}"]`).value) || 0;
      loan.startDate = document.querySelector(`[data-edit-loan-start="${id}"]`).value || loan.startDate;
      state.editing = null;
      persist(); render();
    });
  });

  // ===== EDIÇÃO — empréstimos bancários =====
  document.querySelectorAll('[data-edit-bloan]').forEach(el => {
    el.addEventListener('click', () => {
      state.editing = { kind: 'bloan', id: el.dataset.editBloan };
      render();
    });
  });
  document.querySelectorAll('[data-save-bloan]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.saveBloan;
      const loan = state.bankLoans.find(l => l.id === id);
      if (!loan) return;
      loan.name = document.querySelector(`[data-edit-bloan-name="${id}"]`).value.trim() || loan.name;
      loan.bankId = document.querySelector(`[data-edit-bloan-bank="${id}"]`).value || loan.bankId;
      loan.loanType = document.querySelector(`[data-edit-bloan-type="${id}"]`).value || loan.loanType;
      loan.totalAmount = parseFloat(document.querySelector(`[data-edit-bloan-total="${id}"]`).value) || 0;
      loan.installments = parseInt(document.querySelector(`[data-edit-bloan-installments="${id}"]`).value) || loan.installments;
      // "Pagas" no formulário: só reconstrói o paidMap se o número informado for diferente da contagem atual.
      const newPaidCount = parseInt(document.querySelector(`[data-edit-bloan-paid="${id}"]`).value) || 0;
      const currentPaidCount = countPaid(loan.paidMap);
      if (newPaidCount !== currentPaidCount) {
        const m = {};
        for (let i = 1; i <= newPaidCount; i++) m[i] = true;
        loan.paidMap = m;
      }
      loan.monthlyAmount = parseFloat(document.querySelector(`[data-edit-bloan-monthly="${id}"]`).value) || loan.monthlyAmount;
      loan.interestRate = parseFloat(document.querySelector(`[data-edit-bloan-interest="${id}"]`).value) || 0;
      loan.cet = parseFloat(document.querySelector(`[data-edit-bloan-cet="${id}"]`).value) || 0;
      loan.startDate = document.querySelector(`[data-edit-bloan-start="${id}"]`).value || loan.startDate;
      state.editing = null;
      persist(); render();
    });
  });

  // ===== TOGGLE DE PARCELAS PAGAS =====
  // Itens de lista (fixos, apps, lazer)
  document.querySelectorAll('[data-toggle-list-paid]').forEach(el => {
    el.addEventListener('click', () => {
      const [listKey, id] = el.dataset.toggleListPaid.split(':');
      // Se o id começa com "rule:", é um item virtual derivado de regra
      if (id.startsWith('rule:')) {
        const parts = id.split(':');
        const ruleId = parts[1];
        const monthKey = parts.slice(2).join(':'); // mês está em parts[2]
        toggleVirtualPaid(ruleId, monthKey);
        persist(); render();
        return;
      }
      const m = getMonth(state.currentMonth);
      const item = (m[listKey] || []).find(x => x.id === id);
      if (!item) return;
      item.paid = !item.paid;
      persist(); render();
    });
  });

  // Marcar todos como pagos / desmarcar todos
  document.querySelectorAll('[data-mark-all-paid]').forEach(el => {
    el.addEventListener('click', () => {
      const listKey = el.dataset.markAllPaid;
      const items = getEffectiveListItems(state.currentMonth, listKey);
      const m = getMonth(state.currentMonth);
      items.forEach(it => {
        if (it.isVirtual && it.recurringRuleId) {
          // Marca no paidByMonth da regra
          const rule = state.recurringRules.find(r => r.id === it.recurringRuleId);
          if (rule) {
            if (!rule.paidByMonth) rule.paidByMonth = {};
            rule.paidByMonth[state.currentMonth] = true;
          }
        } else {
          const item = (m[listKey] || []).find(x => x.id === it.id);
          if (item) item.paid = true;
        }
      });
      persist(); render();
    });
  });
  document.querySelectorAll('[data-unmark-all-paid]').forEach(el => {
    el.addEventListener('click', () => {
      const listKey = el.dataset.unmarkAllPaid;
      const items = getEffectiveListItems(state.currentMonth, listKey);
      const m = getMonth(state.currentMonth);
      items.forEach(it => {
        if (it.isVirtual && it.recurringRuleId) {
          const rule = state.recurringRules.find(r => r.id === it.recurringRuleId);
          if (rule && rule.paidByMonth) delete rule.paidByMonth[state.currentMonth];
        } else {
          const item = (m[listKey] || []).find(x => x.id === it.id);
          if (item) item.paid = false;
        }
      });
      persist(); render();
    });
  });

  // ===== REGRAS RECORRENTES =====
  // Criar nova regra
  document.querySelectorAll('[data-rule-add]').forEach(el => {
    el.addEventListener('click', () => {
      const listKey = el.dataset.ruleAdd;
      const name = (document.querySelector(`[data-rule-new-name="${listKey}"]`).value || '').trim();
      const amount = parseFloat(document.querySelector(`[data-rule-new-amount="${listKey}"]`).value);
      const frequency = document.querySelector(`[data-rule-new-frequency="${listKey}"]`).value;
      const startMonth = document.querySelector(`[data-rule-new-start="${listKey}"]`).value || state.currentMonth;
      const endMonth = document.querySelector(`[data-rule-new-end="${listKey}"]`).value || null;
      if (!name || !amount) { showToast('Preencha nome e valor da regra', 'ti-alert-circle'); return; }
      const anniversaryMonth = frequency === 'yearly' ? parseInt(startMonth.split('-')[1]) : null;
      state.recurringRules.push({
        id: uid(), name, amount, listKey, frequency,
        startMonth, endMonth, anniversaryMonth,
        active: true, paidByMonth: {}
      });
      persist(); render();
    });
  });
  // Editar (entrar em modo edição)
  document.querySelectorAll('[data-rule-edit]').forEach(el => {
    el.addEventListener('click', () => {
      state.editing = { kind: 'rule', id: el.dataset.ruleEdit };
      render();
    });
  });
  // Salvar edição
  document.querySelectorAll('[data-rule-save]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.ruleSave;
      const rule = state.recurringRules.find(r => r.id === id);
      if (!rule) return;
      rule.name = (document.querySelector(`[data-rule-edit-name="${id}"]`).value || '').trim() || rule.name;
      rule.amount = parseFloat(document.querySelector(`[data-rule-edit-amount="${id}"]`).value) || rule.amount;
      rule.frequency = document.querySelector(`[data-rule-edit-frequency="${id}"]`).value || rule.frequency;
      rule.startMonth = document.querySelector(`[data-rule-edit-start="${id}"]`).value || rule.startMonth;
      rule.endMonth = document.querySelector(`[data-rule-edit-end="${id}"]`).value || null;
      if (rule.frequency === 'yearly') {
        rule.anniversaryMonth = parseInt(rule.startMonth.split('-')[1]);
      }
      state.editing = null;
      persist(); render();
    });
  });
  // Pausar/reativar
  document.querySelectorAll('[data-rule-toggle-active]').forEach(el => {
    el.addEventListener('click', () => {
      const rule = state.recurringRules.find(r => r.id === el.dataset.ruleToggleActive);
      if (!rule) return;
      rule.active = rule.active === false ? true : false;
      persist(); render();
    });
  });
  // Excluir regra
  document.querySelectorAll('[data-rule-del]').forEach(el => {
    el.addEventListener('click', () => {
      if (!confirm('Excluir esta regra recorrente?\n\nIsso remove a regra de todos os meses futuros. Os items físicos já lançados em meses passados continuam intactos.')) return;
      state.recurringRules = state.recurringRules.filter(r => r.id !== el.dataset.ruleDel);
      persist(); render();
    });
  });

  // Destacar (personalizar) uma ocorrência de regra só neste mês
  document.querySelectorAll('[data-detach-rule]').forEach(el => {
    el.addEventListener('click', () => {
      const [listKey, ruleId] = el.dataset.detachRule.split(':');
      const rule = state.recurringRules.find(r => r.id === ruleId);
      if (!rule) return;
      const m = getMonth(state.currentMonth);
      if (!m[listKey]) m[listKey] = [];
      // Se já existe item físico desta regra neste mês, não duplica
      if (m[listKey].some(x => x.recurringRuleId === ruleId)) {
        showToast('Este mês já está personalizado', 'ti-info-circle');
        return;
      }
      // Cria item físico com os dados atuais da regra, mantendo vínculo (recurringRuleId)
      // para o getEffectiveListItems não duplicar com o virtual
      const paidByMonth = rule.paidByMonth || {};
      const newId = uid();
      m[listKey].push({
        id: newId,
        name: rule.name,
        amount: rule.amount,
        paid: !!paidByMonth[state.currentMonth],
        recurringRuleId: ruleId  // marca a origem; some o virtual neste mês
      });
      // Abre edição imediatamente
      state.editing = { kind: 'list', id: newId, listKey };
      persist(); render();
      showToast('Personalizado só neste mês', 'ti-pencil');
    });
  });

  // Compra de cartão: marca a parcela específica do mês atual
  document.querySelectorAll('[data-toggle-purchase-paid]').forEach(el => {
    el.addEventListener('click', () => {
      const [cardId, purchaseId, installmentNum] = el.dataset.togglePurchasePaid.split(':');
      const card = state.cards.find(c => c.id === cardId);
      if (!card) return;
      const purchase = (card.purchases || []).find(p => p.id === purchaseId);
      if (!purchase) return;
      purchase.paidMap = toggleInstallment(purchase.paidMap, installmentNum);
      persist(); render();
    });
  });
  // Financiamento
  document.querySelectorAll('[data-toggle-loan-paid]').forEach(el => {
    el.addEventListener('click', () => {
      const [loanId, installmentNum] = el.dataset.toggleLoanPaid.split(':');
      const loan = state.loans.find(l => l.id === loanId);
      if (!loan) return;
      loan.paidMap = toggleInstallment(loan.paidMap, installmentNum);
      persist(); render();
    });
  });
  // Empréstimo bancário
  document.querySelectorAll('[data-toggle-bloan-paid]').forEach(el => {
    el.addEventListener('click', () => {
      const [loanId, installmentNum] = el.dataset.toggleBloanPaid.split(':');
      const loan = state.bankLoans.find(l => l.id === loanId);
      if (!loan) return;
      loan.paidMap = toggleInstallment(loan.paidMap, installmentNum);
      persist(); render();
    });
  });

  // Cancelar qualquer edição
  document.querySelectorAll('[data-cancel-edit]').forEach(el => {
    el.addEventListener('click', () => {
      state.editing = null;
      render();
    });
  });

  // Year: click month
  document.querySelectorAll('[data-goto-month]').forEach(el => {
    el.addEventListener('click', () => {
      state.currentMonth = el.dataset.gotoMonth;
      state.activeTab = 'dashboard';
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  const exportBtn = document.getElementById('export-btn');
  if (exportBtn) exportBtn.addEventListener('click', exportData);
  const importBtn = document.getElementById('import-btn');
  const importFile = document.getElementById('import-file');
  if (importBtn && importFile) {
    importBtn.addEventListener('click', () => importFile.click());
    importFile.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) importData(e.target.files[0]);
    });
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function loadChartJS(cb) {
  if (typeof Chart !== 'undefined') return cb();
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js';
  s.onload = cb;
  document.head.appendChild(s);
}

// Delegação única para os botões de navegação de mês (anexada uma vez só no boot).
// Os botões ficam no header fixo e não são recriados — listener único basta.
function bindMonthNav() {
  document.body.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const a = btn.dataset.act;
    if (a === 'prev-month') {
      state.currentMonth = shiftMonth(state.currentMonth, -1);
      render();
    } else if (a === 'next-month') {
      state.currentMonth = shiftMonth(state.currentMonth, 1);
      render();
    }
  });
}

loadChartJS(() => {
  loadFromStorage();
  bindMonthNav();
  render();
});
</script>

<!-- Registro do service worker (transforma em PWA instalável e offline) -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js')
      .then(reg => {
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          if (newWorker) {
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                console.log('Nova versão disponível. Recarregue para atualizar.');
              }
            });
          }
        });
      })
      .catch(err => console.warn('Service worker não registrou:', err));
  });
}
</script>

</html>
